Darius I = دارا الأول
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = إن استمرار وجودكم يشكل إحراجًا لجميع القادة في كل مكان! يجب أن يتم تدميرك!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = اللعنة عليك! أنت تحتي يا ابن سائق الحمار! سوف أسحقك!
You mongrel! Cursed be you! The world will long lament your heinous crime! = أيها الهجين! ملعون أنت! سوف يندب العالم طويلًا جريمتك الشنيعة!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = السلام عليكم! أنا داريوس، الملك العظيم والمتميز لملوك بلاد فارس العظيمة... ولكن أعتقد أنك تعرف ذلك.
In my endless magnanimity, I am making you this offer. You agree, of course? = في شهامتي التي لا نهاية لها، أقدم لك هذا العرض. هل توافقين بالطبع؟
Good day to you! = يوم جيد لك!
