Napoleon = نابليون
You're disturbing us, prepare for war. = أنت تزعجنا، استعد للحرب.
You've fallen into my trap. I'll bury you. = لقد وقعت في فخ بلدي. سأدفنك.
I congratulate you for your victory. = أهنئك على فوزك.
Welcome. I'm Napoleon, of France; the smartest military man in world history. = مرحبًا. أنا نابليون من فرنسا. أذكى رجل عسكري في تاريخ العالم.
France offers you this exceptional proposition. = تقدم لكم فرنسا هذا العرض الاستثنائي.
Hello. = مرحبا.
It's you. = إنه أنت.
Ancien Régime = النظام القديم
Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = يعيش نابليون الأول، القنصل الأول وإمبراطور فرنسا! بعد الثورة المجيدة التي قمعت النظام الملكي الذي دام قرونًا، وقفت الأمة الفرنسية في قلب أوروبا كجمهورية، وكانت تعتزم تصدير مُثُلها إلى القارة الأوروبية بأكملها، إما عن طريق الدبلوماسية أو الحرب. كانت العاصمة الفرنسية باريس، أكثر من أي وقت مضى، المركز العالمي للثقافة والفنون والآداب. بجيشها العظيم، المعروف بأنه واحد من أعظم الجيوش في التاريخ، حاربت فرنسا ببسالة جميع الأعداء المحيطين بها، لكنها سقطت في نهاية المطاف أمام تحالف القوى الأوروبية الأخرى.
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = نابليون بونابرت، حاكم الشعب الفرنسي، هل ستعيد بناء الإمبراطورية للانتقام من أعدائك، وجعل عاصمتها مرة أخرى مدينة الأضواء؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
