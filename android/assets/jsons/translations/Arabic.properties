Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = تسبب الوحدات المصابة ضررا أقل، لكنها تتعافى بعد الأدوار التي تبقى فيها دون نشاط.\nتستعيد الوحدات 10 نقاط صحة لكل دور في أراضي العدو أو الأراضي المحايدة،\nو20 داخل أراضيك و25 في مدنك.

