Theodora = ثيودورا
It is always a shame to destroy a thing of beauty. Happily, you are not one. = من العار دائمًا أن ندمر شيئًا من الجمال. لحسن الحظ، أنت لست واحدا.
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = الآن عزيزتي، نوبات الغضب غير لائقة على الإطلاق. يجب أن أعلمك درسا.
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = مثل طفل يلعب بالألعاب أنت. لن يحبك شعبي أبدًا، ولن يتحمل هذا السخط برشاقة.
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = يا إلهي، أليست هذه مفاجأة سارة - ماذا يمكنني أن أسميك أيها الغريب الغامض؟ أنا ثيودورا، محبوبة بيزنطة.
I have heard that you adept at certain kinds of ... interactions. Show me. = لقد سمعت أنك ماهر في أنواع معينة من... التفاعلات. أرِنِي.
