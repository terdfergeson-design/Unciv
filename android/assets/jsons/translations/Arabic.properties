Catherine = كاترين
You've behaved yourself very badly, you know it. Now it's payback time. = لقد تصرفت بشكل سيء للغاية، أنت تعرف ذلك. الآن حان وقت الاسترداد.
You've mistaken my passion for a weakness, you'll regret about this. = لقد أخطأت في اعتبار شغفي نقطة ضعف، وسوف تندم على ذلك.
We were defeated, so this makes me your prisoner. I suppose there are worse fates. = لقد هزمنا، وهذا يجعلني سجينتك. أعتقد أن هناك مصائر أسوأ.
Fine then. It's your call. = حسنًا إذن. إنها مكالمتك.
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = أحييك أيها الغريب! إذا كنت ذكيًا ولباقًا بقدر ما تتمتع به من جاذبية، فسنتفق معًا على ما يرام.
How would you like it if I propose this kind of exchange? = ما رأيك لو اقترحت هذا النوع من التبادل؟
Hello! = مرحبا!
What do you need?! = ماذا تحتاج؟!
Siberian Riches = ثروات سيبيريا
Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = السلام لصاحبة الجلالة الإمبراطورية كاثرين، إمبراطورة كل الروس. إن شعبكم، الذي يعيش في أكبر دولة في العالم، من المحيط الهادئ في الشرق إلى بحر البلطيق في الغرب، عانى من الحروب والجفاف والعديد من الكوارث، مما أشبع المجتمع الروسي بالبطولة والمثابرة، وأنتج فنانين وعلماء من بين الأفضل في العالم. إن روسيا إمبراطورية قوية تطالب بحق بمكانتها في التحالف العالمي للقوى العظمى.
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = الإمبراطورة كاثرين، شعبك حريص على المجد الروسي، لإحياء النور المقدس للوطن الأم. هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
