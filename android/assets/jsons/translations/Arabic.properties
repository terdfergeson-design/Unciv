Harun al-Rashid = هارون الرشيد
The world will be more beautiful without you. Prepare for war. = العالم سيكون أجمل بدونك. الاستعداد للحرب.
Fool! You will soon regret dearly! I swear it! = أحمق! سوف تندم قريبا غاليا! أقسم!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = لقد فزت، تهانينا. قصري الآن في حوزتك، وأتوسل إليك أن تهتم جيدًا بالطاووس.
Our future battle will be glorious. = معركتنا المستقبلية ستكون مجيدة.
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = مرحباً بك أيها الأجنبي أنا هارون الرشيد خليفة العرب. تعال وأخبرني عن إمبراطوريتك.
Come forth, let's do business. = تعالوا، دعونا القيام بأعمال تجارية.
Peace be upon you. = السلام عليكم.
Trade Caravans = القوافل التجارية
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = صلوات الله العظيم عليك أيها الخليفة العظيم هارون الرشيد قائد الشعب العربي العظيم! الإمبراطورية الإسلامية، الخلافة، التي ولدت من الفوضى بعد وفاة النبي محمد عام 632 م، كانت تهدف إلى تطبيق حكم الله على الأرض كلها. وبمشيئة الله وصلت الخلافة إلى كامل قوتها، فحكمت إسبانيا وشمال أفريقيا والشرق الأوسط والأناضول والبلقان وبلاد فارس، حتى أنها تفوقت على الإمبراطورية الرومانية العظمى. كانت الفنون والعلم هدية مقدسة للجزيرة العربية خلال العصور الوسطى، حيث غاصت الأراضي الكافرة في أوروبا في عمق الجهل والفوضى. واستمرت الخلافة لمدة ستمائة عام، وسقطت أخيرًا أمام المغول، طاعون العالم المتحضر.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = الخليفة العظيم هارون الرشيد، كل العرب يتوقون إلى العظمة! يجب أن تكون الجزيرة العربية مرة أخرى أرض الفنون والمعرفة، والتي بموجب شريعة الله المشرقة لن تخشى أي عدو! هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
