#################### Lines from VictoryTypes from Civ V - Vanilla ####################

Complete all the spaceship parts to win! = أكمل جميع أجزاء سفينة الفضاء للفوز!
# Requires translation!
spaceship parts = 
You have achieved victory through mastery of Science! You have conquered the mysteries of nature and led your people on a voyage to a brave new world! Your triumph will be remembered as long as the stars burn in the night sky! = لقد حققت النصر من خلال إتقان العلم! لقد غزت أسرار الطبيعة وقادت شعبك في رحلة إلى عالم جديد شجاع! سيتم تذكر انتصارك طالما أن النجوم تحترق في سماء الليل!

Complete 5 policy branches and build the Utopia Project to win! = أكمل 5 فروع للسياسات وابن مشروع المدينة الفاضلة لتحقيق النصر!
You have achieved victory through the awesome power of your Culture. Your civilization's greatness - the magnificence of its monuments and the power of its artists - have astounded the world! Poets will honor you as long as beauty brings gladness to a weary heart. = لقد حققت النصر من خلال القوة الهائلة لثقافتك. إن عظمة حضارتكم وعظمة آثارها وقوة فنانيها قد أذهلت العالم! سيكرمك الشعراء ما دام الجمال يفرح القلب المتعب.

Capture all enemy Capitals to win! = الاستيلاء على جميع عواصم العدو للفوز!
The world has been convulsed by war. Many great and powerful civilizations have fallen, but you have survived - and emerged victorious! The world will long remember your glorious triumph! = لقد اهتز العالم بسبب الحرب. لقد سقطت العديد من الحضارات العظيمة والقوية، لكنك نجوت وخرجت منتصرًا! سوف يتذكر العالم طويلا انتصارك المجيد!

Build the UN and be voted world leader to win! = ابن الأمم المتحدة وافز بالتصويت لزعامة العالم لتحقيق النصر!
Anyone should build [buildingFilter] = يجب على أي شخص بناء [buildingFilter]
# Requires translation!
Win diplomatic vote = 
You have triumphed over your foes through the art of diplomacy! Your cunning and wisdom have earned you great friends - and divided and sown confusion among your enemies! Forever will you be remembered as the leader who brought peace to this weary world! = لقد انتصرت على خصومك من خلال فن الدبلوماسية! لقد أكسبك مكرك وحكمتك أصدقاء عظماء - وزرعوا الارتباك بين أعدائك! سوف نتذكرك إلى الأبد كقائد جلب السلام إلى هذا العالم المتعب!

Do things to win! = افعل الأشياء للفوز!
Have highest score after max turns = حقق أعلى نتيجة عند بلوغ الحد الأقصى للأدوار


