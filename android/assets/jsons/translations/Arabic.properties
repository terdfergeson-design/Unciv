Once again, greetings. = 
Dutch East India Company = شركة الهند الشرقية الهولندية
Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = تحية للأمير الحكيم والشجاع ويليام أوف أورانج، الذي حرر هولندا وأعطى القوة للشعب الهولندي. في عام 1568، قمت بقيادة تمرد ضد الهيمنة الإسبانية، للحصول على الحرية لشعبك، وبالتالي بدأت حرب الثمانين عامًا. كانت أفعالك كلها تهدف إلى إنشاء واحدة من أولى الجمهوريات الحديثة في أوروبا، المقاطعات السبع المتحدة. كان التمرد هو معنى حياتك وموتك، كما كان أيضًا سببًا لاغتيالك عام 1584. لكن موتك أعطى المزيد من الفخر والشجاعة لشعبك، للنضال من أجل الحرية ضد أي مضطهدين. اسمك محفور في التاريخ باعتباره "أبو الوطن"، وهو رمز لاستقلال هولندا إلى الأبد.
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = أيها الأمير الشجاع، شعبك يطلب حكمتك ليحصل على حريته مرة أخرى، ولينير العالم بالأفكار التقدمية والحديثة. هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
