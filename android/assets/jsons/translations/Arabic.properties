'Men, like bullets, go farthest when they are smoothest.' - Jean Paul = "الرجال، مثل الرصاص، يذهبون أبعد عندما يكونون في سلاسة." - جان بول
Ballistics = علم المقذوفات

'The root of the evil is not the construction of new, more dreadful weapons. It is the spirit of conquest.' - Ludwig von Mises = "جذر الشر ليس بناء أسلحة جديدة أكثر فظاعة. إنها روح الغزو». - لودفيغ فون ميزس
