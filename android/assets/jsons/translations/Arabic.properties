This is better than you deserve, but let it not be said that I am an unfair man. = هذا أفضل مما تستحقه، لكن لا يقال إنني رجل غير عادل.
Good day to you. = يوم جيد لك.
# Requires translation!
Scourge of God = 
Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = أتيلا العظيم، المحارب العظيم وزعيم إمبراطورية الهون، رجالك يسجدون أمامك. خلال القرن الخامس، قمت أنت وأخوك بليدا بغزو العديد من الأراضي، وشكلتا إمبراطورية عظيمة وقادتا أقوى قوة مخيفة في العصور القديمة. لقد ألهمت الخوف لدى الأباطرة الرومان أنفسهم، الذين أطلقوا عليك اسم "Flagellum Dei"، أي "آفة الله"، حيث سيطرت على مملكة تلو الأخرى في البلقان، وغزت الإمبراطورية الرومانية الشرقية، إلى بلاد الغال وشمال إيطاليا، وخططت لغزو روما نفسها. لم تنجو إمبراطوريتك لفترة طويلة بعد وفاتك، لكن اسمك وأسطورتك بقيا لآلاف السنين.
Fearsome General, your mighty hordes are at your command, waiting to crush your foes once again and to conquer all the riches the world has to offer! Will your new empire shine through the ages of history? = أيها الجنرال المخيف، جحافلك الجبارة تحت أمرتك، في انتظار سحق أعدائك مرة أخرى والاستيلاء على كل الثروات التي يقدمها العالم! هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
