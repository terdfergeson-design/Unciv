# Capturing a city

What would you like to do with the city of [cityName]? = ماذا تريد أن تفعل بمدينة [cityName]؟
Annex = الملحق
Annexed cities become part of your regular empire. = تصبح المدن التي تم ضمها جزءًا من إمبراطوريتك العادية.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = يولد مواطنوها تعاسة مضاعفة، إلا إذا قمت ببناء محكمة.
Your civilization may not annex this city. = لا يجوز لحضارتكم ضم هذه المدينة.
Puppet = تابعة
Puppeted cities do not increase your tech or policy cost. = لا تزيد المدن التابعة تكلفة التقنيات أو السياسات.
You have no control over the the production of puppeted cities. = لا يمكنك التحكم في إنتاج المدن التابعة.
Puppeted cities also generate 25% less Science and Culture. = تنتج المدن التابعة أيضا علما وثقافة أقل بنسبة 25%.
A puppeted city can be annexed at any time. = يمكن ضم المدينة التابعة في أي وقت.
Liberate (city returns to [originalOwner]) = تحرير (تعود المدينة إلى [originalOwner])
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = يؤدي تحرير المدينة إلى إعادتها إلى مالكها الأصلي، مما يمنحك تعزيزًا هائلاً لعلاقتك معهم!
Raze = هدم
Razing the city annexes it, and starts burning the city to the ground. = يؤدي هدم المدينة إلى ضمها والبدء بإحراقها حتى تسويتها بالأرض.
Razing the city puppets it, and starts burning the city to the ground. = يؤدي هدم المدينة إلى جعلها تابعة والبدء بإحراقها حتى تسويتها بالأرض.
The population will gradually dwindle until the city is destroyed. = وسوف يتضاءل عدد السكان تدريجيا حتى يتم تدمير المدينة.
Original capitals and holy cities cannot be razed. = العواصم الأصلية والمدن المقدسة لا يمكن هدمها.
Destroy = تدمير
Destroying the city instantly razes the city to the ground. = يؤدي تدمير المدينة إلى تسويتها بالأرض فورا.
Keep it = احتفظ بها
Remove your troops in our border immediately! = أخرجوا قواتكم من حدودنا فورًا!
Sorry. = آسف.
Never! = أبدا!
Those lands were not yours to take. This has not gone unnoticed. = تلك الأراضي لم تكن ملكك لتأخذها. هذا لم يمر دون أن يلاحظه أحد.

