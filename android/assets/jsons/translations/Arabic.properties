# Requires translation!
Research Agreements = 

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = مع نمو المدن من حيث الحجم والنفوذ، يتعين عليك التعامل مع آلية السعادة التي لم تعد مرتبطة بكل مدينة على حدة. \n بدلاً من ذلك، تشترك إمبراطوريتك بأكملها في نفس المستوى من الرضا. \n مع نمو مدنك من حيث عدد السكان، ستجد أنه من الصعب أكثر فأكثر إبقاء إمبراطوريتك سعيدة.
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = بالإضافة إلى ذلك، لا يمكنك حتى إجراء أي تحسينات على المدينة تزيد من السعادة إلا بعد إجراء البحث المناسب.\nإذا انخفضت سعادة إمبراطوريتك إلى ما دون الصفر، فسوف يتضرر معدل نمو مدنك.\nإذا أصبحت إمبراطوريتك تعيسة للغاية (كما هو موضح بواسطة أيقونة الوجه المبتسم في الجزء العلوي من الواجهة)\n، فستتعرض جيوشك لعقوبة كبيرة على فعاليتها القتالية الشاملة.
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = هذا يعني أنه من الصعب جدًا التوسع بسرعة في Unciv.\n ليس الأمر مستحيلًا، ولكن باعتبارك لاعبًا جديدًا ربما لا ينبغي عليك القيام بذلك.\n إذن ماذا يجب أن تفعل؟ هدئ أعصابك واستكشف وقم بتحسين الأرض التي لديك من خلال بناء العمال. \n قم ببناء مدن جديدة فقط بمجرد العثور على المكان الذي تعتقد أنه مناسب.

# Requires translation!
Unhappiness = 
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = يبدو أن مواطنيك غير سعداء!\nبينما أنت غير سعيد، فإن حضارتك ستعاني من العديد من الآثار الضارة، والتي تزداد حدتها مع ارتفاع مستوى التعاسة.
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = التعاسة لها سببان رئيسيان: السكان والمدن.\n كل مدينة تسبب 3 تعاسة، ولكل سكان 1
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = هناك طريقتان رئيسيتان لمكافحة التعاسة: \n من خلال بناء مباني السعادة لسكانك\n أو من خلال تحسين الموارد الفاخرة داخل حدودك.

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = لقد دخلت العصر الذهبي!\n يتم تجميع نقاط العصر الذهبي في كل دور من خلال إجمالي السعادة \n لحضارتك\nعندما يكون توليد الثقافة والإنتاج في العصر الذهبي يزيد بنسبة +20%،\n وكل قطعة تقدم بالفعل ذهبًا واحدًا على الأقل ستوفر ذهبًا إضافيًا.

# Requires translation!
Roads and Railroads = 
Roads reduce the Movement Points required to move between two tiles connected by Roads. = تعمل الطرق على تقليل نقاط الحركة المطلوبة للتنقل بين قطعتين متصلتين بالطرق.
Railroads improve this reduction even more! = تعمل السكك الحديدية على تحسين هذا التخفيض أكثر!
This greatly improves the speed you can get Units around the map. = يؤدي هذا إلى تحسين السرعة التي يمكنك من خلالها الحصول على الوحدات حول الخريطة بشكل كبير.
Until you research the technology that removes it, Roads do not cross Rivers = وإلى أن تبحث عن التكنولوجيا التي تزيلها، فإن الطرق لا تعبر الأنهار
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = سيؤدي ربط مدنك بالعاصمة عن طريق الطرق و/أو السكك الحديدية إلى توليد الذهب عبر طريق التجارة.
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = ومع ذلك، نظرًا لأن كل طريق وسكك حديدية لها تكلفة صيانة، فقد يكون من الاقتصادي أكثر الانتظار حتى تنمو المدن ويتم وضعها فقط عند الحاجة.

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = سيؤدي ربط مدنك بالعاصمة عن طريق الطرق و/أو السكك الحديدية إلى توليد الذهب عبر طريق التجارة. تكسب المزيد من الذهب كلما زاد عدد سكان المدينة وعاصمتك.
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = لاحظ أن كل طريق يكلف صيانة ذهبية واحدة لكل دور، وكل خط سكة حديد يكلف 2 ذهبية، لذلك قد يكون من الاقتصادي الانتظار حتى تنمو المدن!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = كما توفر خطوط السكك الحديدية التي تربط المدينة بالعاصمة زيادة في الإنتاج بنسبة 25% للمدينة، ولكن ليس للعاصمة.
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = ترتبط طرق التجارة أيضًا عبر المياه عبر مباني معينة مثل المرفأ. طالما أن هناك سلسلة يمكنها الوصول إلى العاصمة، فهناك طريق تجاري. ابحث عن هذا الرمز باللون الأصفر أسفل اسم المدينة ليعني أن لديك طريقًا تجاريًا نشطًا إلى عاصمتك.
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = يمكن كسر طرق التجارة إما عن طريق الحصار أو عن طريق إزالة/نهب سلسلة الطرق/السكك الحديدية المتصلة.
