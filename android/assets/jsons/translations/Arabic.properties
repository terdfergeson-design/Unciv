Suleiman I = سليمان الأول
Your continued insolence and failure to recognize our preeminence leads us to war. = إن وقاحتكم المستمرة وفشلكم في الاعتراف بتفوقنا يقودنا إلى الحرب.
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = جيد. سيشهد العالم القوة التي لا تقبل الجدل لجيوشي ومجد الإمبراطورية.
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = الخراب! يخرب! أصبحت إسطنبول إرم الأعمدة، التي لا يتذكرها إلا الشعراء الحزينون.
From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = من روعة توبكابي تحييكم الأمة العثمانية أيها الغريب! أنا سليمان، قيصر الروم، وأرحب بكم.
Let us do business! Would you be interested? = دعونا نفعل الأعمال التجارية! هل ستكون مهتما؟
Barbary Corsairs = القراصنة البربريين
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = أيها السلطان سليمان العظيم، بارك الله فيك! أنت تحظى بالاحترام بسبب قوتك وثروتك وكرمك، وتستحق حقًا أن تُلقب بـ "العظيم"! ولدت الإمبراطورية العثمانية في بيثينيا، وبدأت كدولة صغيرة في شرق الأناضول في القرن الثاني عشر، ثم توسعت غربًا إلى الأناضول. على مدى القرن التالي، هزم شعبك الإمبراطورية البيزنطية، وضم تركيا والبلقان، واستوعب بذكاء كل عجائب ومعارف الحضارة البيزنطية. في منتصف القرن الخامس عشر، أضاف العثمانيون القسطنطينية إلى إمبراطوريتهم، وأقاموا رابطًا استراتيجيًا بين أوروبا والشرق الأوسط. استمرت الإمبراطورية في التوسع لعدة قرون لتصل إلى شمال إفريقيا والشرق الأوسط وأوروبا الشرقية في أوجها، لكنها اختفت بوحشية في فوضى الحرب العالمية الأولى في أوائل القرن العشرين.
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = أيها الخليفة العظيم، يطلب منك شعبك بناء الإمبراطورية مرة أخرى، إلى مستوى القوة والمجد الذي حققته ذات يوم، وما بعده! هل ستعيد إحياء العصر الذهبي العثماني؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
