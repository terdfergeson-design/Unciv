Embassies are available using the Gods and Kings ruleset. = السفارات متاحة باستخدام مجموعة قواعد الآلهة والملوك.
# Requires translation!
Defensive Pacts = 

Open Borders from other player and vice versa allow units to freely pass through their territory. = تسمح الحدود المفتوحة من اللاعب الآخر والعكس للوحدات بالمرور بحرية عبر أراضيها.
They also let Missionaries to enter other players' territory without suffering attrition. = كما أنهم يسمحون للمبشرين بدخول أراضي اللاعبين الآخرين دون التعرض للاستنزاف.
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = تنتهي صلاحية الحدود المفتوحة اعتمادًا على سرعة اللعبة ويتم إلغاؤها عند إعلان الحرب، إلا أن الإغلاق لا يسري إلا بعد انتهاء الحرب ويلزم تداولها مرة أخرى.
You gain diplomatic boost with other AI player if you both have Open Borders to each other = يمكنك الحصول على دعم دبلوماسي مع لاعب آخر يعمل بالذكاء الاصطناعي إذا كان لكل منكما حدود مفتوحة لبعضكما البعض
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = كن حذرا عند منح حدود مفتوحة، فقد يؤسس اللاعب الآخر مدينة قرب أراضيك في منطقة تنوي استخدامها، وقد يستخدم أراضيك لمهاجمة أصدقائك أو حلفائك من دول المدن.
Note that before you can offer or accept open borders, both Nations need the required Technology. = لاحظ أنه قبل أن تتمكن من عرض الحدود المفتوحة أو قبولها، تحتاج كلا الدولتين إلى التكنولوجيا المطلوبة.
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = عند اللعب بقواعد الآلهة والملوك، يجب إنشاء سفارات متبادلة قبل أن يتم تداول الحدود المفتوحة.

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = في اتفاقيات البحث، تقرر أنت وحضارة أخرى إجراء بحث مشترك في مجال التكنولوجيا. \n في نهاية الاتفاقية، سيحصل كل منكما على "مبلغ مقطوع" من "العلم"، والذي سيذهب إلى إحدى تقنياتك التي لم يتم بحثها.
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = يعتمد مقدار ⍾العلم الذي تتلقاه في النهاية على ⍾العلم الذي تولده مدنك ومدن الحضارة الأخرى خلال الاتفاقية - كلما زاد ذلك، كان ذلك أفضل!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = لاحظ أنه قبل أن تتمكن من الاستثمار في اتفاقية بحث، يجب أن يكون لديك إعلان صداقة، وتحتاج كلتا الدولتين إلى التكنولوجيا المطلوبة، وتحتاج كلتا الدولتين إلى ما يكفي من الذهب المتاح للاتفاقية.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = عند اللعب بقواعد الآلهة والملوك، يجب إنشاء سفارات متبادلة قبل التوقيع على اتفاقية البحث.

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = تسمح لك الاتفاقيات الدفاعية أنت ومواطن آخر بحماية بعضكما البعض من المعتدين. \n بمجرد توقيع الاتفاقية الدفاعية، سوف تنجذب إلى حروبهم الدفاعية المستقبلية، تمامًا كما سيتم جذبهم إلى حروبك الدفاعية المستقبلية. سيؤدي إعلان الحرب على أي مدنية إلى إزالة كل اتفاقياتك الدفاعية. سيتعين عليك إعادة التوقيع عليها لاستخدام تأثيرها.
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = كن حذرًا عند توقيع اتفاقيات دفاعية لأنها قد تدخلك في حروب قد لا ترغب في الدخول فيها.
The AI is very careful and will not accept defensive pacts with less than 80 influence. = الذكاء الاصطناعي حذر للغاية ولن يقبل الاتفاقيات الدفاعية التي يقل نفوذها عن 80.
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = لاحظ أنه قبل أن تتمكن من التوقيع على اتفاقية دفاعية، يجب أن يكون لديك إعلان صداقة، وتحتاج كلا الدولتين إلى التكنولوجيا المطلوبة.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = عند اللعب مع قواعد الآلهة والملوك، يجب إنشاء سفارات متبادلة قبل التوقيع على ميثاق دفاعي.

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = ليست كل الدول تتنافس معك من أجل النصر. \nدول المدينة هي دول لا تستطيع الفوز، ولا يمكن التجارة معها، وبدلاً من ذلك تمنح مكافآت معينة للحضارات الصديقة.
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = وبدلاً من ذلك، يتم تحديد العلاقات الدبلوماسية مع الدول المدينة من خلال النفوذ - مقياس "مدى إعجاب الدولة المدينة بك". \n يمكن زيادة النفوذ من خلال مهاجمة أعدائهم، وتحرير مدينتهم، ومنحهم مبالغ من الذهب.
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = يتم منح مكافآت معينة عندما يكون نفوذك أعلى من 30.\n عندما يكون لديك نفوذ أعلى من 60، ويكون لديك أعلى نفوذ معهم من بين جميع الحضارات، فإنك تعتبر "حليفًا" لهم، وتحصل على المزيد من المكافآت وإمكانية الوصول إلى الموارد الفاخرة والاستراتيجية في أراضيهم.

While working the land is good, eventually your Citizens will want to Specialize. = على الرغم من أن العمل في الأرض أمر جيد، إلا أن مواطنيك سيرغبون في التخصص في النهاية.
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = ستوفر بعض المباني أيضًا فتحات متخصصة. ستظهر هذه الفتحات في إدارة المواطن داخل شاشة المدينة ضمن المتخصصين. يمكن ملء كل فتحة بمواطن سيصبح بعد ذلك متخصصًا.
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = سيولد كل متخصص قدرًا معينًا من العائد كما هو موضح على يمين الخانات المتاحة.
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = في حين أن هذه طريقة رائعة لتخصيص إنتاج محصول المدينة خارج نطاق إنتاجية الخانات المحيطة، إلا أن المتخصصين لديهم قيمة إضافية. يقوم كل واحد أيضًا بإنشاء نقاط شخصية رائعة في كل دور. ومع وجود ما يكفي منهم، سينضم شخص عظيم جديد إلى أمتك.
# Requires translation!
Great People = 

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = تقوم بعض المباني والمتخصصين في المدن بإنشاء نقاط الشخص العظيم في كل دور. \n هناك عدة أنواع من الأشخاص العظماء، وتتراكم نقاطهم بشكل منفصل. \n يمكن عرض عدد النقاط لكل دور والنقاط المتراكمة في شاشة النظرة العامة.
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = وبدلاً من ذلك، يمكن عرض توزيع نقاط الشخص العظيم لكل مدينة في كل شاشة مدينة (راجع مقالة تلميحات واجهة المستخدم).
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = بمجرد تجميع ما يكفي من النقاط، سيتم إنشاء شخص عظيم من هذا النوع! \n يمكن لكل شخص عظيم إنشاء تحسين كبير معين يعطي عوائد كبيرة بمرور الوقت، أو استهلاكه على الفور لتوفير مكافأة معينة الآن.
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = توفر التحسينات الرائعة أيضًا أي موارد إستراتيجية موجودة ضمنها، لذا لا داعي للقلق إذا تم الكشف عن الموارد أسفل تحسيناتك!

# Requires translation!
Removing Terrain Features = 
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = تحتوي بعض الخانات على ميزات تضاريس - مثل سهول الفيضانات أو الغابات - فوقها. يمكن للعمال إزالة بعض هذه الطبقات، مثل Jungle وMarsh وForest.\n لا تؤدي إزالة ميزة التضاريس إلى إزالة أي موارد في التجانب، وهي مطلوبة عادةً لإضافة تحسينات تستغل تلك الموارد.

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = تعتبر العجائب الطبيعية، مثل جبل فوجي وصخرة جبل طارق والحاجز المرجاني العظيم، ميزات فريدة من نوعها للتضاريس غير القابلة للعبور، وروائع من الطبيعة الأم، والتي تمتلك صفات استثنائية تجعلها مختلفة تمامًا عن التضاريس المتوسطة.\nإنهم يستفيدون من خلال إعطائك كميات كبيرة من الثقافة أو العلم أو الذهب أو الإنتاج إذا تم تشغيلها في مدنك، ولهذا السبب قد تحتاج إلى إخضاعها لإمبراطوريتك في أسرع وقت ممكن.

# Requires translation!
Keyboard = 
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = إذا كان لديك لوحة مفاتيح، فستصبح بعض مفاتيح الاختصار متاحة. على سبيل المثال، تظهر مفاتيح أمر الوحدة أو مفاتيح منتقي التحسين مباشرة في الأزرار المقابلة لها.
On the world screen the hotkeys are as follows: = على الشاشة العالمية، تكون مفاتيح التشغيل السريع كما يلي:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = مسافة أو 'N' - الوحدة التالية أو الدور\n'E' - نظرة عامة على الإمبراطورية (آخر صفحة تم عرضها)\n'+'، '-' - تكبير / تصغير\nHome - توسيط على العاصمة أو فتح شاشة المدينة الخاصة بها إذا تم توسيطها بالفعل
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 - فتح Civilopedia\nF2 - نظرة عامة على الإمبراطورية الصفقات\nF3 - نظرة عامة على الإمبراطورية الوحدات\nF4 - نظرة عامة على الإمبراطورية الدبلوماسية\nF5 - السياسات الاجتماعية\nF6 - التقنيات\nF7 - نظرة عامة على الإمبراطورية المدن\nF8 - النصر التقدم\nF9 - نظرة عامة على الإمبراطورية Stats\nF10 - نظرة عامة على الإمبراطورية الموارد\nF11 - Quicksave\nF12 - التحميل السريع
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R - تبديل عرض موارد الخانات\nCtrl-Y - تبديل عرض إنتاج الخانات\nCtrl-O - خيارات اللعبة\nCtrl-S - حفظ اللعبة\nCtrl-L - تحميل اللعبة\nCtrl-U - تبديل واجهة المستخدم (الشاشة العالمية فقط)
All of these can be reassigned. = كل هذه يمكن إعادة تعيينها.

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = هذا هو المكان الذي تقضي فيه معظم وقتك في لعب Unciv. شاهد العالم، وتحكم في وحداتك، وقم بالوصول إلى الشاشات الأخرى من هنا.
①: The menu button - civilopedia, save, load, options... = ①: زر القائمة - Civilopedia، حفظ، تحميل، خيارات...
②: The player/nation whose turn it is - click for diplomacy overview. = ②: اللاعب/الأمة التي يأتي دورها - انقر للحصول على نظرة عامة على الدبلوماسية.
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: زر التكنولوجيا - يعرض شجرة التكنولوجيا التي تسمح بعرض التقنيات أو البحث عنها.
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: زر السياسات الاجتماعية - يعرض السياسات المطبقة والقابلة للتحديد، ومع وجود نقاط ثقافية كافية يمكنك تفعيل سياسات جديدة.
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: زر الدبلوماسية - يُظهر لمدير الدبلوماسية المكان الذي يمكنك فيه التحدث مع الحضارات الأخرى.
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: أزرار إجراءات الوحدة - أثناء تحديد الوحدة، تظهر الإجراءات المحتملة هنا.
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: جزء معلومات الوحدة/المدينة - يعرض معلومات حول الوحدة أو المدينة المحددة.
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: اسم (ورمز الوحدة) الوحدة أو المدينة المحددة، مع الصحة الحالية إذا أصيبت. سيؤدي النقر فوق اسم الوحدة أو رمزها إلى فتح إدخال Civilopedia الخاص بها.
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: تسمح أزرار الأسهم بالانتقال إلى وحدة الخمول التالية/السابقة.
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: بالنسبة للوحدة المحددة، تظهر الترقيات الخاصة بها هنا، والنقر فوق يؤدي إلى شاشة الترقيات لتلك الوحدة.
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: نقاط الحركة المتبقية/لكل دور، والقوة والخبرة/نقاط الخبرة اللازمة للترقية. بالنسبة للمدن، تحصل على قوتها القتالية.
⑫: This button closes the selected unit/city info pane. = ⑫: يقوم هذا الزر بإغلاق جزء معلومات الوحدة/المدينة المحدد.
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: يظهر هذا الجزء عندما تأمر وحدة بمهاجمة العدو. في الأعلى يوجد المهاجم والمدافع مع نقاط القوة الأساسية لكل منهما.
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: يوجد أدناه مكافآت القوة أو العقوبات وأعمدة الصحة المتوقعة قبل / بعد الهجوم.
⑮: The Attack Button - let blood flow! = ⑮: زر الهجوم - دع الدم يتدفق!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: تُظهر الخريطة المصغرة نظرة عامة على العالم، مع المدن المعروفة والتضاريس وضباب الحرب. سيؤدي النقر إلى وضع الخريطة الرئيسية.
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: على جانب الخريطة المصغرة توجد أزرار تبديل ميزات العرض - إنتاجية الخانات، والمؤشر العملي، وإظهار/إخفاء الموارد. تظهر إعدادات المرآة هذه على شاشة الخيارات وتكون مخفية إذا قمت بإلغاء تنشيط الخريطة المصغرة.
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: معلومات الخانات الخاصة بالشكل السداسي المحدد - العائد الحالي أو المحتمل، والتضاريس، والتأثيرات، والوحدات الحالية، والمدينة الموجودة هناك وما إلى ذلك. عندما يكون ذلك مناسبًا، يؤدي النقر فوق أحد السطر إلى فتح إدخال Civilopedia المقابل.
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: الإخطارات - ما حدث خلال مرحلة "الدور التالي" الأخيرة. بعضها قابل للنقر لإظهار مكان ذي صلة على الخريطة، والبعض الآخر يعرض عدة أماكن عند النقر بشكل متكرر.
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: زر الدور التالي - ما لم تكن هناك أشياء يجب القيام بها، وفي هذه الحالة تتغير التسمية إلى "الوحدة التالية"، و"اختيار السياسة"، وما إلى ذلك.
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: زر اللعب الجماعي - هنا يمكنك بسهولة التحقق من ألعابك النشطة متعددة اللاعبين.
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: يؤدي زر النظرة العامة إلى شاشة نظرة عامة على الإمبراطورية مع علامات تبويب مختلفة (يتم تذكر آخر ما تم عرضه) والتي تحتوي على معلومات حيوية حول حالة حضارتك في العالم.
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: يُظهر رمز ♪ الثقافة ♪ الثقافة و ♪ الثقافة المتراكمة اللازمة للسياسة التالية - في هذه الحالة، تخبرنا علامة التعجب بإمكانية تفعيل السياسة التالية. يعد النقر طريقة أخرى لمدير السياسات.
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: يتم عرض مواردك الإستراتيجية المعروفة هنا مع الرقم المتاح (تم خصم الاستخدام بالفعل) - انقر للانتقال إلى شاشة نظرة عامة على الموارد.
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: يظهر توازن السعادة/التعاسة وإما العصر الذهبي مع الأدوار إلى اليسار أو السعادة المتراكمة مع المبلغ اللازم للعصر الذهبي بجوار الوجه المبتسم. يؤدي النقر أيضًا إلى شاشة نظرة عامة على الموارد حيث أن الموارد الفاخرة هي وسيلة لتحسين السعادة.
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: تعرض أيقونة ⍾العلم عدد نقاط ⍾العلم المنتجة في كل دور. انقر عليها لفتح شجرة التقنيات.
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: عدد الأدوار التي تم لعبها مع الترجمة إلى السنوات التقويمية. انقر لرؤية نظرة عامة على النصر.
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: عدد العملات الذهبية الموجودة في خزانتك ودخلك. تؤدي النقرات إلى شاشة نظرة عامة على الإحصائيات.
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: كمية ☮الإيمان التي ولّدها مواطنوك، أو "إيقافها" إذا تم تعطيل الدين. يؤدي النقر عليه إلى الانتقال إلى شاشة النظرة العامة على الدين.
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: في وسط كل هذا - خريطة العالم! هنا، تشير علامة "X" إلى مكان خارج الخريطة. نعم، ما لم يتم استخدام خيار الالتفاف، فإن عوالم Unciv تكون مسطحة. لا تقلق، سفنك لن تسقط من على الحافة.
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: بالمناسبة، إليك كيف تبدو حدود الإمبراطورية - وهي باللون الوطني للدولة التي تمتلك الإقليم.
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: وهذه هي دائرة الاستهداف الحمراء التي أدت إلى جزء الهجوم مرة أخرى أسفل ⑬.
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = ما لا تراه: سيطرح زر الرجوع للهاتف/الجهاز اللوحي السؤال عما إذا كنت ترغب في مغادرة Unciv والعودة إلى Real Life. في إصدارات سطح المكتب، يمكنك استخدام المفتاح ESC.

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = عندما تكون في مراحل لاحقة من اللعبة، قد يكون لديك الكثير من الوحدات ولكن القليل فقط للقيام به. لمساعدتك، قمنا بتنفيذ ميزة التشغيل التلقائي التي تتيح لك استخدام الذكاء الاصطناعي للعب جزء من دورك أو كل دورك.
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = لتمكين التشغيل التلقائي، انتقل إلى الخيارات وافتح علامة التبويب "التشغيل التلقائي" واضغط على "إظهار زر التشغيل التلقائي".
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = يؤدي النقر فوق زر التشغيل التلقائي إلى فتح قائمة منبثقة لاختيار أجزاء التشغيل التلقائي أو كل دورك.
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = يؤدي النقر فوق "بدء التشغيل التلقائي" في القائمة المنبثقة أو الضغط لفترة طويلة على زر "التشغيل التلقائي" إلى بدء التشغيل التلقائي متعدد الأدوار. سيؤدي هذا إلى تشغيل دورك التالي كما لو كنت من الذكاء الاصطناعي.
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = لإلغاء التشغيل التلقائي متعدد الأدوار، يمكنك الضغط على زر التشغيل التلقائي أو زر الدور التالي أو فتح قائمة الخيارات.
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = لا يُنصح بالتشغيل التلقائي متعدد الأدوار في مستويات الصعوبة الأصعب لأن الذكاء الاصطناعي الخاص بك لن يلعب بشكل أفضل ضد الذكاء الاصطناعي الذي يحتوي على المعدلات.
Multi-turn AutoPlay for multiplayer is not yet supported. = التشغيل التلقائي متعدد الأدوار للاعبين المتعددين غير مدعوم حتى الآن.

After building a shrine, your civilization will start generating ☮Faith. = بعد بناء الضريح، ستبدأ حضارتك في توليد ☮الإيمان.
When enough ☮Faith has been generated, you will be able to found a pantheon. = عندما يتم توليد ما يكفي من ☮الإيمان، سوف تكون قادرًا على تأسيس البانثيون.
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = سيوفر البانثيون مكافأة صغيرة لحضارتك والتي ستنطبق على جميع المدن التي تعتبرها ديانة الأغلبية.
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = يمكن لكل حضارة أن تختار فقط معتقدًا واحدًا من البانثيون، ولا يمكن اختيار كل حضارة إلا مرة واحدة.
Generating more ☮Faith will allow you to found a religion. = توليد المزيد ☮الإيمان سيسمح لك بتأسيس دين.

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = استمر في توليد الإيمان، وفي النهاية سيولد نبي عظيم في إحدى مدنك.
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = يمكن استخدام هذا النبي العظيم في أشياء متعددة: بناء مكان مقدس، وتأسيس دين، ونشر دينك.
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = عند تأسيس دينك، يمكنك اختيار معتقدين آخرين. سينطبق معتقد المؤسس عليك فقط، بينما سينطبق معتقد التابع على جميع المدن التي تتبع دينك.
Additionally, the city where you used your great prophet will become the holy city of that religion. = بالإضافة إلى ذلك، فإن المدينة التي استخدمت فيها نبيك العظيم ستصبح المدينة المقدسة لذلك الدين.
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = بمجرد أن تقوم بتأسيس دين، سيستمر ولادة الأنبياء العظماء بين الحين والآخر، على الرغم من أن مقدار الإيمان الذي يجب عليك ادخاره سيكون أعلى.
One of these great prophets can then be used to enhance your religion. = يمكن بعد ذلك استخدام أحد هؤلاء الأنبياء العظماء لتعزيز دينك.
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = سيسمح لك هذا باختيار اعتقاد تابع آخر، بالإضافة إلى اعتقاد معزز، ينطبق عليك فقط.
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = اهتم بتأسيس دين قريبًا، حوالي نصف اللاعبين فقط في اللعبة قادرون على تأسيس دين!

# Requires translation!
Religion inside cities = 
When founding a city, it won't follow a religion immediately. = عند تأسيس مدينة، فإنها لن تتبع دينًا على الفور.
The religion a city follows depends on the total pressure each religion has within the city. = يعتمد الدين الذي تتبعه المدينة على الضغط الإجمالي الذي يمارسه كل دين داخل المدينة.
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = ويتم تخصيص المتابعين بنفس نسب هذه الضغوطات، ويمكن الاطلاع على هؤلاء المتابعين في شاشة المدينة.
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = يُسمح لك بفحص الأتباع والضغوط الدينية في المدن التي لا تملكها عن طريق اختيارهم.
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = في كلا المكانين، سيؤدي النقر/النقر على أيقونة الدين إلى إظهار معلومات مفصلة مع تأثيراتها.
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = وبناءً على ذلك، يمكنك التعرف على الأديان التي لديها الكثير من الضغط المتراكم في المدينة، وأيها لا يوجد بها أي ضغط تقريبًا.
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = تتبع المدينة دينًا إذا كان غالبية سكانها يتبعون هذا الدين، وعندها فقط ستحصل على آثار معتقدات التابعين والبانثيون لذلك الدين.

# Requires translation!
Spreading Religion = 
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = إن نشر الدين يحدث بشكل طبيعي، ولكن يمكن تسريعه باستخدام المبشرين أو الأنبياء العظماء.
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = يمكن شراء المبشرين في المدن التي تتبع ديانة رئيسية، وسوف يأخذون دين تلك المدينة.
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = لذا احرص على المكان الذي تشتريه منه! إذا حولت حضارة أخرى إحدى مدنكم إلى دينها، فإن المبشرين الذين اشتروا هناك سيتبعون دينهم.
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = الأنبياء العظماء دائمًا ما يكون لديهم دينك عند ظهورهم، حتى لو تم شراؤهم في مدن تتبع ديانات أخرى، لكن الأنبياء العظماء الذين تم أسرهم يحتفظون بدينهم الأصلي.
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = يستطيع كل من الأنبياء والمبشرين العظماء نشر الدين في المدن عندما يكونون داخل حدودها، حتى في مدن الحضارات الأخرى.
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = يمكن لهاتين الوحدتين أيضًا الدخول إلى خانات الحضارات التي ليس لديك اتفاقية حدود مفتوحة معها!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = لكن انتبه، سيفقد المبشرون 250 قوة دينية في كل دور ينتهيون به أثناء تواجدهم في الأراضي الأجنبية.
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = وهذا يقلل من فعاليتهم في نشر الدين، وإذا وصلت قوتهم الدينية إلى الصفر، فقدوا إيمانهم واختفوا.
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = عندما تنشر دينك، تضاف القوة الدينية للوحدة كضغط على هذا الدين.
Cities also passively add pressure of their majority religion to nearby cities. = تضيف المدن أيضًا بشكل سلبي ضغطًا على دين الأغلبية إلى المدن المجاورة.
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = توفر كل مدينة +6 ضغطًا لكل دور لجميع المدن ضمن 10 مربعات، على الرغم من أن مقدار الضغط الدقيق يعتمد على سرعة اللعبة.
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = يمكن أيضًا رؤية هذا الضغط في شاشة المدينة، ويعطيك فكرة عن كيفية تطور الأديان في مدنك إذا لم تفعل أي شيء.
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = توفر المدن المقدسة أيضًا +30 ضغطًا للدين الموجود هناك لنفسها، مما يجعل من الصعب جدًا تحويل مدينة مقدسة بشكل فعال.
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = أخيرًا، قبل تأسيس دين، ستبدأ المدن الجديدة التي تستقر فيها بـ 200 ضغطة لآلهةك.
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = بهذه الطريقة، ستبدأ جميع مدنك في اتباع معبدك طالما لم تقم بتأسيس ديانة بعد.

# Requires translation!
Inquisitors = 
Inquisitors are the last religious unit, and their strength is removing other religions. = المحققون هم آخر وحدة دينية، وقوتهم هي إزالة الديانات الأخرى.
They can remove all other religions from one of your own cities, removing any pressures built up. = يمكنهم إزالة جميع الديانات الأخرى من إحدى مدنك، وإزالة أي ضغوط متراكمة.
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = الأنبياء العظماء أيضًا لديهم هذه القدرة، ويزيلون جميع الديانات الأخرى في المدينة عند نشر دينهم.
Often this results in the city immediately converting to their religion = غالبًا ما يؤدي هذا إلى تحول المدينة على الفور إلى دينهم
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = بالإضافة إلى ذلك، عندما يتمركز أحد المحققين في مركز المدينة أو بجواره مباشرة، لا تستطيع وحدات الديانات الأخرى نشر عقيدتها هناك، على الرغم من أن الانتشار الطبيعي لا يتأثر.

The Mayan unique ability, 'The Long Count', comes with a side effect: = قدرة المايا الفريدة، "العد الطويل"، تأتي مع آثار جانبية:
Once active, the game's year display will use mayan notation. = بمجرد تنشيطه، سيستخدم عرض عام اللعبة تدوين المايا.
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = قام المايا بقياس الوقت بالأيام بدءًا مما نسميه 11 أغسطس 3114 قبل الميلاد. اليوم يسمى كين، 20 يومًا هي وينال، 18 وينال هي تون، 20 طن هي كاتون، 20 كاتون هي باكتون، 20 باكتون هي بيكتون، وهكذا.
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = يعرض Unciv فقط ය B'ak'tuns وඹ K'atuns وම Tuns (من اليسار إلى اليمين) لأن ذلك يكفي لتقريب سنوات التقويم الميلادي. أرقام المايا واضحة جدًا لفهمها. استمتع بفك رموزها!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = سوف تطلب مدنك بشكل دوري سلعًا فاخرة مختلفة لتلبية رغبتها في الحصول على أشياء جديدة في الحياة.
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = إذا تمكنت من الحصول على الرفاهية المطلوبة عن طريق التجارة أو التوسع أو الغزو، فستحتفل المدينة بيوم "نحن نحب الملك" لمدة 20 دور.
During the We Love The King Day, the city will grow 25% faster. = خلال يوم "نحن نحب الملك"، ستنمو المدينة بشكل أسرع بنسبة 25%.
This means exploration and trade is important to grow your cities! = وهذا يعني أن الاستكشاف والتجارة مهمان لتنمية مدنك!

Air Combat and Interception = القتال الجوي والاعتراض
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = القتال الجوي يشبه إلى حد كبير القتال العادي، مع بعض التجاعيد. لا يزال يتم التعامل مع الضرر باستخدام نفس المعادلات بناءً على القوة النسبية لوحدة الهجوم والدفاع.
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = ومع ذلك، قبل قتال المهاجم والمدافع، هناك مرحلة قتالية إضافية تسمى الاعتراض. إذا كانت هناك أي وحدة ذات نطاق اعتراض يغطي الخانة المستهدفة التي تمت مهاجمتها، فستحاول اعتراض الوحدة الجوية المهاجمة. إذا تمكنت عدة وحدات من الاعتراض، فإن الوحدة التي تتمتع بفرصة اعتراض أعلى هي التي تفعل ذلك.
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = بشكل عام، الوحدات البرية/البحرية لديها نطاق اعتراض يبلغ 2 خانة، والوحدات الجوية لديها نطاق اعتراض من نطاق هجومها.
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = لا تحتاج الوحدات البرية والبحرية إلى نقاط حركة للاعتراض، بل تحتاج فقط إلى هجمات. لا يمكن للوحدات الجوية أن تتحرك أو تهاجم في الدور السابق.
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = تتحرك وحدة الاعتراض لمعرفة ما إذا كانت ستضرب أم لا. سواء كانت الضربة أم لا تكلف هجومًا، فإن معظم الوحدات (بدون الترقيات) يمكنها الهجوم مرة واحدة فقط في كل دور للأمة. لا تكلف نقاط الحركة، لكن الوحدات الجوية التي استخدمت حركتها لا يمكنها الاعتراض بين الأدوار.
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = إذا ضربت وحدة الاعتراض، فإنها تتسبب في ضرر وفقًا لحساب القوة القتالية للوحدة الجوية المهاجمة، ومن المحتمل أن يكون ذلك مع أي مكافآت قوة تنطبق على الاعتراض. لا تتلقى ضررًا من الوحدة الجوية المهاجمة.
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = بعد حل مشكلة الاعتراض، تقوم الوحدة الجوية المهاجمة ووحدة الدفاع في المربع المستهدف بالقتال كالمعتاد، مع إلحاق الضرر بكلا الجانبين.
To help deal with Interceptions, see Air Sweeps. = للمساعدة في التعامل مع عمليات الاعتراض، راجع عمليات المسح الجوي.

# Requires translation!
Air Sweeps = 
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = الوحدات المقاتلة قادرة على إجراء عمليات مسح جوية على الخانة للمساعدة في إزالة الاعتراضات الجوية أو البحرية أو البرية المحتملة للعدو والتي يمكنها الوصول إلى تلك الخانة.
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = على الرغم من أن هذا الإجراء سيتطلب هجومًا، إلا أن الفائدة تكمن في استخلاص عمليات الاعتراض للمساعدة في حماية وحداتك الجوية الأخرى. وخاصة القاذفات الخاصة بك.
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = سترسم وحدتك دائمًا اعتراضًا، إذا كان بإمكانك الوصول إلى المربع المستهدف، حتى لو كان لدى وحدة الاعتراض فرصة لتفويت الفرصة.
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = إذا لم يكن المعترض وحدة جوية (على سبيل المثال، برية أو بحرية)، فلن تتعرض وحدة كنس الهواء والمعترض لأي ضرر!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = إذا كان المعترض عبارة عن وحدة جوية، فسوف تلحق الوحدتان الضرر ببعضهما البعض في قتال مباشر بدون مكافآت اعتراض. وتحصل وحدة الاجتياح الجوي المهاجمة فقط على أي مكافآت قوة الاجتياح الجوي.

# Requires translation!
Fortify, Guard, Withdraw = 
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = تتمتع معظم الوحدات البرية بالقدرة على التحصين. عندما يقضون وقتًا دون أن يتحركوا، سيحصلون ببطء على مكافأة تحصين لقوتهم القتالية تمثل الحفر والاستعداد في حالة وقوع هجوم.
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = تتمتع بعض الوحدات بالقدرة على الانسحاب قبل شن هجوم قتال قريب. ومع ذلك، ربما ترغب في أن يقفوا على موقفهم لحماية خانات معين. إذا قمت بذلك، فامنحهم أمر الحرس وسيظلون ثابتين حتى يموتوا أو تعطيهم أوامر جديدة.
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = هذا ليس مثل Fortify لكنهم سيظلون يحصلون على مكافأة التحصين. إنهم ببساطة لن يستخدموا قدرتهم على السحب. ستحاول الوحدات المحصنة ذات قدرة الانسحاب الفرار عند مهاجمتها.

# Requires translation!
City Tile Blockade = 
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = تم حظر إحدى الخانات الخاصة بك بواسطة عدو: عندما تقف وحدة العدو على قطعة تملكها، لن تنتج القطعة عائدات ولن تتمكن المدينة من العمل في هذا الدور. ستقوم المدينة بإعادة تخصيص السكان من الخانات المحظور تلقائيًا.
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = الوحدات البرية العسكرية للعدو تحجب الخانات الذي تقف عليه. بالإضافة إلى ذلك، تقوم الوحدات البحرية العسكرية للعدو بسد خانات المياه المجاورة. لحماية خاناتك من الحصار، ضع وحدة عسكرية صديقة عليه أو حارب الغزاة.

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = إحدى مدنك تحت حصار بحري! عندما يتم حظر جميع خانات المياه المجاورة لمدينة ساحلية، تفقد المدينة اتصال الميناء بجميع المدن الأخرى، بما في ذلك العاصمة. تأكد من فك حصار المدن من خلال نشر وحدات بحرية عسكرية صديقة لمحاربة الغزاة.

# Requires translation!
Spies! = 
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = في المرة الأولى التي يصل فيها المجتمع المدني إلى عصر النهضة، تحصل كل دولة على جاسوس واحد. في كل مرة يصل فيها مدني إلى عصر ما بعد ذلك، يحصلون على جاسوس آخر.
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = يمكن إرسال الجواسيس إلى مدن أجنبية لسرقة التكنولوجيا أو تزوير الانتخابات أو تنظيم الانقلابات. ضعهم في مدنك للقيام بأعمال مكافحة التجسس.
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = يُسمح بجاسوس واحد فقط لكل مدينة في كل مدينة. الجواسيس غير الموجودين في أي مدينة يقضون إجازة في مخبأ التجسس الخاص بك.
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = سيحاول الجواسيس الذين تم تأسيسهم في مدن الحضارات الكبرى سرقة التكنولوجيا بمعدل يعتمد على الإنتاج العلمي في المدينة. النجاح في سرقة التكنولوجيا سوف يرفع مستوى جاسوسك. سيؤدي الفشل في النجاح إلى رفع مستوى الجاسوس المدافع إذا كان موجودًا.
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = سيحاول الجواسيس الموجودون في دول المدن تزوير الانتخابات من أجل اكتساب النفوذ وتقليل نفوذ الحضارات الأخرى. ولا يمكن أن يفوز إلا جاسوس واحد يشارك في تزوير الانتخابات.
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = فالجاسوس الذي يقوم بتزوير الانتخابات في دولة المدينة قد يقوم أيضًا بانقلاب. تعتمد احتمالية نجاح الانقلاب على نفوذك النسبي على الحليف الحالي للدولة المدينة، ومستوى جاسوسك، ومستوى الجاسوس الذي يمتلكه الحليف الحالي في الدولة المدينة إذا كان موجودًا. إن نجاح الانقلاب سيجعلك حليفهم الجديد ويقلل من نفوذ جميع الحضارات الأخرى. سيؤدي فشل الانقلاب إلى قتل جاسوسك ورفع مستوى الجاسوس المدافع إذا كان موجودًا.
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = الجواسيس الذين تم إعدادهم في مدنك سوف يقومون بعمليات استخباراتية مضادة. إنها تقلل من فرصة نجاح الجواسيس الآخرين الذين يحاولون سرقة التكنولوجيا الخاصة بك.
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = الجواسيس ذوو الرتب الأعلى لديهم فرصة أكبر للنجاح. أقصى رتبة يمكن أن يصل إليها الجاسوس هي المرتبة 3. بعد مقتل الجاسوس، سيتم إحياؤه بعد قدر معين من التحولات إلى المرتبة 1.
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = سيؤدي تشييد المباني مثل الشرطة ومركز الشرطة إلى تقليل معدل سرقة التكنولوجيا للجواسيس في تلك المدينة.
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = التجسس متاح باستخدام مجموعة قواعد الآلهة والملوك. لتمكينه في لعبة جديدة، انقر على الإعدادات المتقدمة، ثم انقر على خيار تمكين التجسس.

# Requires translation!
Keyboard Bindings = 
# Requires translation!
Limitations = 
This is a work in progress. = هذا عمل مستمر
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = لأسباب فنية، يمكن استخدام المفاتيح المباشرة أو مجموعات Ctrl-Letter فقط.
Using the Keys page = استخدام صفحة المفاتيح
Each binding has a button with an image looking like this: = يحتوي كل رابط على زر به صورة تبدو كالتالي:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = أثناء تحريك الماوس فوق زر المفتاح، يمكنك الضغط على المفتاح المطلوب مباشرة لتعيينه.
Double-click the image to reset the binding to default. = انقر نقرًا مزدوجًا فوق الصورة لإعادة تعيين الارتباط إلى الوضع الافتراضي.
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = يتم عرض الارتباطات المعينة لمفاتيحها الافتراضية باللون الرمادي، وتلك التي أعيد تعيينها بواسطتك باللون الأبيض.
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = يتم تمييز المهام المتعارضة باللون الأحمر. يمكن أن توجد التعارضات عبر الفئات، مثل الشاشة العالمية / إجراءات الوحدة. لاحظ أن اللعبة في الوقت الحالي لا تمنع حفظ المهام المتضاربة، رغم أن النتيجة قد تكون غير متوقعة.
For discussion about missing entries, see the linked github issue. = للمناقشة حول الإدخالات المفقودة، راجع مشكلة جيثب المرتبطة.

Welcome to the Civilopedia! = مرحبا بكم في سيفوليديا!
Here you can find information - general help, rules, and what makes up the game world. = هنا يمكنك العثور على معلومات - مساعدة عامة، وقواعد، وما يشكل عالم اللعبة.
How to find information = كيفية العثور على المعلومات
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = حدد الفئات باستخدام الأزرار الموجودة أعلى الشاشة. يوجد أيضًا في الأعلى زر مغادرة Civilopedia والعودة إلى حيث كنت من قبل.
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = تحتوي كل فئة على قائمة إدخالات على يسار الشاشة، مرتبة أبجديًا (مع استثناءات قليلة). سيؤدي النقر فوق أحد الإدخالات إلى تحديث الجزء الأوسط حيث كنت تقرأ هذا حاليًا.
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = يمكن ربط الخطوط بإدخالات Civilopedia الأخرى، ويتم تمييزها برمز ربط سلسلة مثل هذا. يمكنك النقر في أي مكان على الخط لمتابعة الرابط.
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = الفئة الحالية خاصة - جميع المقالات المتعلقة بالمفاهيم العامة موجودة هنا. يطلق عليها "البرامج التعليمية" لأنه يمكنك إعادة النظر فيها هنا أيضًا.
What information can I find = ما هي المعلومات التي يمكنني العثور عليها
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = البيانات المعروضة لا تعتمد على الوضع الحالي للعبتك، على سبيل المثال. المكافآت الخاصة بالدولة التي تلعب بها أو معدلات الصعوبة لن تؤثر على الأرقام.
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = ومع ذلك، فإنه سيعكس التعديلات التي تلعبها! يحدد الجمع بين مجموعة القواعد الأساسية وتعديلات الامتداد التي تحددها قواعد اللعبة، والكائنات الموجودة وكيفية تفاعلها، وتعكس Civilopedia هذه القواعد.
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = إذا قمت بفتح Civilopedia من القائمة الرئيسية، فستكون "مجموعة القواعد" هي تلك الخاصة بآخر لعبة بدأتها.
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = يمكن للأحرف تحديد الفئات، وعندما تكون هناك فئات متعددة تطابق نفس الحرف، يمكنك الضغط عليها بشكل متكرر للتنقل بين هذه الفئات.
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = تسمح مفاتيح الأسهم بالتنقل أيضًا - لليسار/لليمين للفئات، ولأعلى/لأسفل للإدخالات.

# Requires translation!
UI Tips = 
# Requires translation!
World screen = 
Skip all units to end a turn quickly = تخطي جميع الوحدات لإنهاء الدور بسرعة
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = انقر بزر الماوس الأيمن أو اضغط لفترة طويلة على زر "الوحدة التالية" لفتح قائمة منبثقة تسمح بإنهاء الدور دون الحاجة إلى التنقل بين جميع الوحدات. إذا كانت بعض الوحدات آلية، يتوفر زر مخصص لتحريكها قبل إنهاء الدور.
Toggle notification list display = تبديل عرض قائمة الإخطارات
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = على شاشة العالم، قم بتمرير قائمة الإشعارات إلى اليمين لإخفائها مؤقتًا. انقر على زر "الجرس" لعرضها مرة أخرى.
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = يمكن تعيين الحالة الافتراضية لقائمة الإشعارات في الخيارات > العرض > واجهة المستخدم - الإشعارات على الشاشة العالمية.
Entering a City Screen quickly = الدخول إلى شاشة المدينة بسرعة
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = يمكنك النقر بزر الماوس الأيمن أو الضغط لفترة طويلة على زر المدينة على شاشة العالم. والنتيجة هي نفس النقر عليه مرتين - مرة لتحديد الزر وتحريكه، ومرة ​​أخرى لإثارة رد فعل: إظهار شاشة المدينة (إذا كانت المدينة ملكك لتفحصها)، أو عرض النافذة المنبثقة لمعلومات المدينة الأجنبية.
Upgrade multiple units of the same type = ترقية وحدات متعددة من نفس النوع
On the World screen, select an unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = على شاشة العالم، حدد وحدة يمكن ترقيتها، ثم انقر بزر الماوس الأيمن أو اضغط لفترة طويلة على زر "ترقية" لفتح قائمة منبثقة تسمح بترقية جميع الوحدات من هذا النوع مرة واحدة.
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When an unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = في النظرة العامة على الوحدات، تتوفر نفس قائمة الترقية من خلال النقر على أيقونة الوحدة في عمود "الترقية". عندما تكون الوحدة قابلة للترقية، يضيء الرمز إذا تم استيفاء الشروط (ما يكفي من الذهب و/أو الموارد)، وإلا فإنه يصبح خافتًا.
Additional controls for the construction queue = ضوابط إضافية لقائمة انتظار البناء
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = انقر بزر الماوس الأيمن أو اضغط لفترة طويلة على عنصر بناء لفتح قائمة منبثقة تحتوي على عناصر تحكم إضافية، مما يسمح بإدارة إنتاج نفس العنصر في جميع المدن، عن طريق إصدار الأوامر من نفس شاشة المدينة.
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = يقوم خيار "تعطيل" (في مدينة واحدة أو جميع المدن) بنقل عنصر إلى علامة تبويب "معطل" منفصلة، لمنع وضعه في قائمة الانتظار التلقائية من خلال خيار "تخصيص إنتاج المدينة تلقائيًا" أو لإزالة الكائنات غير ذات الصلة من تخطيط الإنتاج. لنقل عنصر معطل مرة أخرى إلى مكانه الأصلي، أعد الدخول إلى القائمة المنبثقة، ثم اختر "تمكين".
Disabled items are set for the current game only and are carried over when founding a new city. = يتم تعيين العناصر المعطلة للعبة الحالية فقط ويتم ترحيلها عند تأسيس مدينة جديدة.
Show Great Person Points breakdown = عرض تفاصيل نقاط الشخص العظيم
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = في اللوحة الجانبية اليمنى، انقر فوق صف الأشخاص العظماء لعرض تفاصيل نقاط الأشخاص العظماء (GPP) المتراكمة في كل دور حسب المدينة الحالية، لهذا النوع من الأشخاص العظماء.
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = انقر فوق أي من أيقونات الأشخاص العظماء لعرض كل إجمالي الناتج الإجمالي (GPP) المتراكم في كل دور حسب المدينة الحالية، لجميع أنواع الأشخاص العظماء.
# Requires translation!
Tech screen = 
Queue multiple technologies in different branches = طابور تقنيات متعددة في فروع مختلفة
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = على شاشة التكنولوجيا، انقر بزر الماوس الأيمن أو اضغط لفترة طويلة على إحدى التقنيات لإضافتها إلى قائمة الانتظار تلقائيًا، حتى لو كانت هذه التقنية في فرع آخر غير العنصر الذي يتم البحث عنه حاليًا. سيتم أيضًا وضع التقنيات الأساسية للبحث في قائمة الانتظار تلقائيًا.
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = انقر بزر الماوس الأيمن أو اضغط لفترة طويلة على العديد من التقنيات لإلحاقها بقائمة انتظار البحث، مهما كان فرعها.
# Requires translation!
Overview screens = 
Reveal known resources on world screen = كشف الموارد المعروفة على الشاشة العالمية
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = في نظرة عامة على الموارد، انقر فوق أيقونة المورد لتوسيط شاشة العالم على المربعات المكتشفة بالفعل والتي توفر هذا المورد.
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = وبدلاً من ذلك، انقر على الرقم "غير المحسن" لتوسيط شاشة العالم فقط على المربعات المملوكة (بواسطتك أو بدول المدن المتحالفة معك) حيث لم يتم تحسين المورد.
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = إذا كان هناك أكثر من مربع متاح، فانقر بشكل متكرر على الإشعار للتنقل عبر كل منهم.
Show diagram line colors = إظهار ألوان خط الرسم التخطيطي
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = في نظرة عامة على السياسة > إظهار الرسم التخطيطي، يمكنك النقر في أي مكان داخل الرسم التخطيطي لعرض جدول يسرد جميع ألوان خطوط العلاقة ومعناها.
# Requires translation!
