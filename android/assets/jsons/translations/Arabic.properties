Pacal = باكال
A sacrifice unlike all others must be made! = يجب تقديم التضحية على عكس كل الآخرين!
# Requires translation!
Muahahahahahaha! = 
Today comes a great searing pain. With you comes the path to the black storm. = اليوم يأتي ألم حارق عظيم. معك يأتي الطريق إلى العاصفة السوداء.
Greetings, wayward one. I am known as Pacal. = تحياتي أيها الضال. أنا معروف باسم باكال.
Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = يا صديقي، أعتقد أنني ربما وجدت طريقة لإنقاذنا جميعًا! انظر، انظر واقبل عرضي!
A fine day, it helps you. = يوم جيد، فإنه يساعدك.
# Requires translation!
The Long Count = 
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = اركع أمام الملك باكال العظيم، ابن الآلهة وحامي منطقة بالينكي! بعد أن تعرضت مملكتك للمضايقات لسنوات من قبل المنافسين المجاورين، قمت بالرد على أعداء شعبك، وهزمت كل واحد منهم وضحيت بقادتهم انتقامًا للإهانات التي تعرض لها أسلافك. إن حكمتك وإرادتك القوية لم تستعيد مجد بالينكي فحسب، بل حولتها إلى مدينة رائعة، حيث بنى شعبك أعظم المعالم الأثرية والهندسة المعمارية التي عرفها العالم على الإطلاق.
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = أيها الملك المطلق، شعبك بحاجة إليك لإنقاذ ثقافة ومعرفة المايا العظيمة. هل ستتمكن من قراءة حركة النجوم، وتجد في السماء القدرة على صد أي أعداء؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
