Haile Selassie = هيلا سيلاسي
I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = لقد جربت كل الطرق الأخرى، لكنك لا تزال مستمرًا في هذا الجنون. أتمنى، من أجل مصلحتك، أن تكون نهايتك سريعة.
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = الصمت هو الذي يسمح للشر أن ينتصر. لن نقف صامتين ونسمح لك بمواصلة هذا المسعى المجنون دون رادع.
God and history will remember your actions this day. I hope you are ready for your impending judgment. = سيذكر الله والتاريخ أفعالك هذا اليوم. آمل أن تكون مستعدًا لحكمك الوشيك.
What a waste of time. = يا لها من مضيعة للوقت.
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = ألف مرحباً بك في أمتنا العادلة. أنا سيلاسي، رأس تافاري ماكونين وإمبراطور إثيوبيا، خادمك المتواضع.
I request that you consider this offer between our two peoples. I believe it will do us both good. = أطلب منكم النظر في هذا العرض بين شعبينا. أعتقد أنه سيفيد كلا منا.
# Requires translation!
Spirit of Adwa = 
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = بارك الله فيك، أيها الإمبراطور الحكيم والصالح لإثيوبيا، هيلا سيلاسي. باعتبارك أحد أعظم حكام إثيوبيا والزعيم الروحي للحركة الراستافارية، فإن نفوذك الجيد على الدبلوماسية والتعاون السياسي يحظى بالثناء في جميع أنحاء العالم. لقد أنشأت أول دستور مكتوب لإثيوبيا، وفضلت الديمقراطية لسنوات قادمة، وحكمتك العظيمة جعلت إثيوبيا تدخل كعضو ميثاق في الأمم المتحدة. ومع سعيك الدائم إلى إصلاح وتحديث أمتك، فقد غيرت مصير إثيوبيا إلى الأفضل.
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = أيها الملك الموقر، إن معرفتك وذكائك مطلوبان مرة أخرى لحماية شعبك من العديد من التهديدات في العالم. هل ستضمن السلام والاستقرار، بالخير والسلطة، في إشعاع Kebra Nagast؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
