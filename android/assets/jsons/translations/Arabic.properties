Dido = ديدو
Tell me, do you all know how numerous my armies, elephants and the gdadons are? No? Today, you shall find out! = أخبروني، هل تعلمون جميعًا كم عدد جيوشنا وأفيالنا وغدادوننا؟ لا؟ اليوم، سوف تكتشف ذلك!
Fate is against you. You earned the animosity of Carthage in your exploration. Your days are numbered. = القدر ضدك. لقد اكتسبت عداوة قرطاج في استكشافك. أيامك معدودة.
The fates became to hate me. This is it? You wouldn't destroy us so without their help. = أصبحت الأقدار تكرهني. هذا هو؟ أنت لن تدمرنا هكذا بدون مساعدتهم
You aren't meeting my expectations. You can do so much better. = أنت لا تلبي توقعاتي. يمكنك أن تفعل ذلك أفضل بكثير.
The Phoenicians welcome you to this most pleasant kingdom. I am Dido, the queen of Carthage and all that belongs to it. = الفينيقيون يرحبون بكم في هذه المملكة الممتعة. أنا ديدو ملكة قرطاجة وكل ما يخصها.
I just had the marvelous idea, and I think you'll appreciate it too. = لقد خطرت لي فكرة رائعة، وأعتقد أنك ستقدرها أيضًا.
What is it now? = ما هو الآن؟
