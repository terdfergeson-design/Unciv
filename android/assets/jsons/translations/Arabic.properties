Boudicca = بوديكا
You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = لن تلوث هذه الأرض بعد الآن بقذارتك! إلى السلاح يا أبناء وطني. نحن نركب إلى الحرب!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = رجل خائن! لن تتحمل الشعوب السلتية مثل هذه الإساءات والافتراءات الغاشمة - سأحصل على خصيتيك!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = أيها الحاكم الحقير، اعلم أنك انتصرت في هذه الحرب بالاسم وحده. مدنكم مدفونة وقواتكم مهزومة. لدي انتصاري الخاص.
Don't forget who you're dealing with. Arrogant moves can get you in danger. = لا تنسى مع من تتعامل. التحركات المتعجرفة يمكن أن تعرضك للخطر.
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = أنا بوديكا، ملكة الكلت. لا ينبغي لأحد أن يقلل من شأني!
Let us join our forces together and reap the rewards. = دعونا نوحد قوانا معًا ونحصد الثمار.
God has given good to you. = الله أعطاك الخير .
# Requires translation!
Druidic Lore = 
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = المجد والشرف لك دائمًا أيتها الملكة المحاربة! في وقت يهيمن عليه الرجال، نجحت في الحصول على العرش والسلطة، ولكنك تحديت أيضًا الإمبراطورية الرومانية الجبارة. بعد أن تمت معاقبتك وإذلالك على يد الغزاة الرومان الدمويين، وحدت شعبك وقادت ثورة رهيبة سعيًا للانتقام. لقد سقطت جحافل كثيرة تحت هجماتكم الشرسة وأحرقتم مدينة لندن بغضبك. بينما ظل الرومان يحتفظون بملكية أرضك بعد هزيمتك النهائية، فإن أفعالك أظهرت لروما أنه لا يمكن احتلال هذه الأرض بالكامل أبدًا، مما جعل نيرون نفسه يفكر في سحب جميع القوات ومغادرة بريطانيا إلى الأبد.
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = أيتها اللبؤة الهائجة، هل ستقودين السلتيين مرة أخرى تحت مجد اسمك، لنشر نيران الحرية، وتحقيق النصر النهائي؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
