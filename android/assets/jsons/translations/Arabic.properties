Sejong = سيجونغ
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = لن يتسامح Jip-hyun-jun (Hall of Worthies) مع سلوكك المزعج بعد الآن. سنحرر المواطنين الواقعين تحت ظلمكم ولو بالقوة، وننيرهم!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = أحمق، بائس بائس! سوف تسحقك القوة العلمية الرائعة لهذا البلد!
Now the question is who will protect my people. A dark age has come. = والسؤال الآن هو من سيحمي شعبي. لقد حان عصر مظلم.
Your words reveal more of your own prejudice than any fault in my own. = تكشف كلماتك عن تحيزك أكثر من أي خطأ في نفسي.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = مرحبا بكم في قصر تشوسون، أيها الغريب. أنا الملك المتعلم سيجونج، الذي يعتني بشعبه العظيم.
We have many things to discuss and have much to benefit from each other. = لدينا أشياء كثيرة لنناقشها ونستفيد كثيرًا من بعضنا البعض.
Oh, it's you = أوه، هذا أنت
Scholars of the Jade Hall = علماء قاعة اليشم
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = تحياتي لك أيها الملك سيجونغ العظيم، وريث أسرة تشوسون! إن الرخاء والإحسان تجاه الرجل العادي هي مبادئ عهدك، وجعلت منك الملك الكوري المحبوب. لقد هدفت دائمًا إلى توفير مجتمع عادل ومتساوي لجميع أفراد شعبك، وكذلك إلى تفضيل المعرفة والاكتشافات التكنولوجية. لقد شبعت حكمتك وذكائك المجتمع الكوري بأكمله، وقام علماء قاعة اليشم بتطوير أول لغة مكتوبة في كوريا، الهانغول، وتبادلوا المزيد من الأدب والعلم مع الشعب بعد قرون من الظلام.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = سيجونغ الحكيم، هل ستهدي شعبك إشعاع الانسجام والمعرفة لتبديد الظلام مرة أخرى؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
