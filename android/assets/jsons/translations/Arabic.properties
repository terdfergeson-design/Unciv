# Requires translation!
Viking Fury = 
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = سكال، هارالد بلوتوث جورمسون، ابن الملك جورم القديم وثيرا دانيبود! بعد سحق جيوش النرويج، أنجزت مشاريع بناء عظيمة في جميع أنحاء أرض الدنمارك العظيمة. تم بناء العديد من الحصون الدائرية في عهدك لحماية الناس من الغزوات الأجنبية، وأيضًا من المشاجرات المحلية. في عام 983 م، نجحت في صد عدة موجات من المستوطنين الألمان الذين حاولوا استعمار أرضك، ثم حافظت دائمًا على مملكتك خالية من أي ضغط أجنبي.
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = باعتبارك أحد الفايكنج الحقيقيين، الذين لا يعرفون الخوف، فقد حان الوقت لإطلاق العنان لجيوش عظيمة من رجال الشمال لجلب اليأس إلى أعدائك! بمشيئة الآلهة، سيكون إما انتصارًا مجيدًا أو وليمة فخمة في فالهالا! هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
