Augustus Caesar = أغسطس قيصر
My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = خزانتي تحتوي على القليل وجنودي بدأوا ينفذ صبرهم... (تتنهد)...لذلك يجب أن تموت.
So brave, yet so stupid! If only you had a brain similar to your courage. = شجاع جدًا، لكنه غبي جدًا! لو كان لديك عقل يشبه شجاعتك.
The gods have deprived Rome of their favour. We have been defeated. = لقد حرمت الآلهة روما من مصلحتها. لقد هُزمنا.
I wasn't sure, but it seems you do have some grit. = لم أكن متأكدة، لكن يبدو أن لديك بعض الجرأة.
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = أحييك. أنا أغسطس، الإمبراطور والبونتيفكس مكسيموس روما. إذا كنت صديقًا لروما، فمرحبًا بك.
I offer this, for your consideration. = أعرض هذا، للنظر فيه.
Hail. = حائل.
What do you want? = ماذا تريد؟
The Glory of Rome = مجد روما
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = سلام قيصر أوغسطس، إمبراطور روما ودومينوس الإمبراطورية الرومانية! لقد كانت إمبراطوريتك هي الأقوى والأكثر رعبًا على الإطلاق في الحضارة الغربية. لقد صاغ الشعب الروماني ثقافته وقانونه وفنه وحربه ببراعة شديدة، حتى أنه لم يكن بمقدور أحد أن ينافس سيادة روما. أدت القوة والشرف إلى فتوحات مجيدة، وهيمنت على جميع الأراضي من إسبانيا في الغرب إلى سوريا في الشرق، حتى أنها وصلت إلى الأراضي البربرية النائية في إنجلترا وألمانيا. لقد تم الإشادة بالفن والهندسة المعمارية الرومانية منذ آلاف السنين، وقد حسدتهما جميع الحضارات الأقل التي تلت ذلك.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = أيها الإمبراطور المجيد، شعبك يحتفل بك ويطلب مجد روما! في أوقات الظلام هذه، سيكون باكس رومانا منارة نور للجميع! هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
