As much as I despise war, I consider it a, hahaha, contribution to the common cause to erase your existence. = بقدر ما أكره الحرب، إلا أنني أعتبرها، هاهاها، مساهمة في القضية المشتركة لمحو وجودك.
You call yourself an exalted ruler, but I see nothing more than a smartly dressed barbarian! = أنت تسمي نفسك حاكمًا عظيمًا، لكني لا أرى أكثر من بربري يرتدي ملابس أنيقة!
My God, be merciful to my soul. My God, feel pity for this... my poor people! = إلهي ارحم روحي. يا إلهي، أشفق على هذا... شعبي المسكين!
I am William of Orange, stadtholder of The Netherlands. Did you need anything? I still have a lot to do. = أنا ويليام أوف أورانج، حاكم هولندا. هل كنت بحاجة إلى أي شيء؟ لا يزال لدي الكثير للقيام به.
I believe I have something that may be of some importance to you. = أعتقد أن لدي شيئًا قد يكون ذا أهمية بالنسبة لك.
