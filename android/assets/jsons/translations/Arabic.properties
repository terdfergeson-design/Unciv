God will probably forgive you... but I shall not. Prepare for war. = من المحتمل أن يسامحك الله...ولكنني لن أفعل ذلك. الاستعداد للحرب.
Repugnant spawn of the devil! You will pay! = تفرخ الشيطان البغيض! سوف تدفع!
If my defeat is, without any doubt, the will of God, then I will accept it. = إذا كانت هزيمتي، دون أي شك، هي إرادة الله، فسوف أقبلها.
God blesses those who deserve it. I am Isabel of Spain. = الله يجزي من يستحق ذلك. أنا إيزابيل من أسبانيا.
I hope this deal will receive your blessing. = آمل أن تنال هذه الصفقة مباركتك.
Seven Cities of Gold = سبع مدن من الذهب
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = القديسة إيزابيلا، مبعوثة الله، ملكة قشتالة وليون العظيمة، شعبك يحتفل بك! إسبانيا بلد جميل وقديم، حلقة وصل بين أوروبا وأفريقيا، شاطئ على البحر الأبيض المتوسط ​​والآخر على المحيط الأطلسي العظيم. لقد استوعبت الثقافة الإسبانية أفضل ما في العالمين المسيحي والإسلامي، وكانت مستعدة للسيطرة على العالم لعدة قرون. وجدت الأساطيل العسكرية الإسبانية القوية والمستكشفون الشجعان واحتلت جزءًا كبيرًا من العالم الجديد. من خلال استغلال قارة جديدة بالكامل وثرواتها، وصلت إسبانيا إلى حالة من القوة لم يتمكن سوى القليل من التنافس معها لمئات السنين.
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = يا إيزابيلا الرائعة والفاضلة! بإرادة السماء، هل ستولد إسبانيا من جديد لتحقق مصيرها المقدس وتصبح إلدورادو جديدة؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
