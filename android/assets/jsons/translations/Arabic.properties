Maria Theresa = ماريا تيريزا
Shame that it has come this far. But ye wished it so. Next time, be so good, choose your words more wisely. = من العار أن الأمر قد وصل إلى هذا الحد. ولكنكم تمنيتم ذلك. في المرة القادمة، كن جيدًا، واختر كلماتك بحكمة أكبر.
What a fool ye are! Ye will end swiftly and miserably. = كم أنت أحمق! سوف تنتهي بسرعة وبشكل بائس.
The world is pitiful! There's no beauty in it, no wisdom. I am almost glad to go. = العالم مثير للشفقة! لا جمال فيه ولا حكمة. أنا سعيد تقريبًا بالذهاب.
The archduchess of Austria welcomes your Eminence to... Oh let's get this over with! I have a luncheon at four o'clock. = أرشيدوقة النمسا ترحب بسماحتكم... أوه، دعنا ننتهي من هذا! لدي غداء في الساعة الرابعة.
I see you admire my new damask. Nobody should say that I am an unjust woman. Let's reach an agreement! = أرى أنك معجب بدمشقي الجديد. لا ينبغي لأحد أن يقول أنني امرأة ظالمة. دعونا نتوصل إلى اتفاق!
