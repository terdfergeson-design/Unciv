Oda Nobunaga = أودا نوبوناغا
I hereby inform you of our intention to wipe out your civilization from this world. = أبلغكم بموجب هذا بنيتنا للقضاء على حضارتكم من هذا العالم.
Pitiful fool! Now we shall destroy you! = أحمق مثير للشفقة! الآن سوف نقوم بتدميرك!
You were much wiser than I thought. = لقد كنت أكثر حكمة بكثير مما كنت أعتقد.
I expected more for you from. = كنت أتوقع منك المزيد.
We hope for a fair and just relationship with you, who are renowned for military bravery. = نأمل في علاقة عادلة وعادلة معكم، أنتم المشهورين بالشجاعة العسكرية.
I would be grateful if you agreed on the following proposal. = وسأكون ممتنا إذا وافقت على الاقتراح التالي.
Oh, it's you... = أوه، هذا أنت...
Bushido = بوشيدو
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = اللورد أودا نوبوناغا، حاكم اليابان، أرض الشمس المشرقة تحت أمرك! عبر التاريخ، عاش الشعب الياباني ومات بشرف، فخورًا بثقافته الغنية بالفنون والآداب. سنوات من الحروب الأهلية الدموية، وغزوات القوى الأجنبية، والثروة ولكن أيضًا الفقر المدقع، لم تغير أبدًا من الإرادة القوية لجزيرة رايزنج صن، حيث تشبعت روح بوشيدو في ساحات القتال والمجتمع الياباني لآلاف السنين. في نهاية القرن التاسع عشر، وتحت النفوذ الأجنبي، سلك شعبكم طريق الحداثة، وفي غضون بضعة عقود، جعل من اليابان أرض الابتكار التكنولوجي والصناعة القوية، التي لا يمكن أن تنافسها إلا قلة من الدول.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = أيها الدايمو العظيم، هل ستتولى مصير اليابان بين يديك، لتضيء الشمس المشرقة العالم؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
