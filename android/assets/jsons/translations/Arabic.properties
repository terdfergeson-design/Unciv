Tutorial Task: [Move unit] = المهمة التعليمية: [Move unit]
Move a unit! = حرّك وحدة!
Click on a unit → Click on a destination → Click the arrow popup. = انقر على وحدة → انقر على الوجهة → انقر فوق السهم المنبثق.

# Requires translation!
Found a city! = 
Select the Settler → Click on 'Found city'. = حدد المستوطن ← انقر على "تأسيس مدينة".

Enter the city screen! = أدخل شاشة المدينة!
Click the city button twice. = انقر على زر المدينة مرتين.

Pick a technology to research! = اختر تقنية للبحث عنها!
Click on the tech button → Select technology → Click 'Research' (bottom right). = انقر على زر التكنولوجيا → حدد التكنولوجيا → انقر فوق "بحث" (أسفل اليمين).

# Requires translation!
Pick a construction! = 
Enter city screen → Click on a unit or building → Click 'add to queue'. = أدخل إلى شاشة المدينة ← انقر على الوحدة أو المبنى ← انقر على "إضافة إلى قائمة الانتظار".

# Requires translation!
Pass a turn! = 
Cycle through units with 'Next unit' → Click 'Next turn'. = قم بالتنقل بين الوحدات باستخدام "الوحدة التالية" → انقر فوق "الدور التالي".

# Requires translation!
Reassign worked tiles! = 
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = أدخل إلى شاشة المدينة → انقر فوق المربع المخصص لإلغاء تعيينه → انقر فوق مربع غير مخصص لتعيين السكان.

# Requires translation!
Got it = 
# Requires translation!
Meet another civilization! = 
Explore the map until you encounter another civilization! = استكشف الخريطة حتى تواجه حضارة أخرى!

Open the options dialog! = افتح مربع حوار الخيارات!
Click the menu button (top left) → Click 'Options'. = انقر على زر القائمة (أعلى اليسار) ← انقر على "خيارات".

# Requires translation!
Construct an improvement! = 
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = أنشئ وحدة عاملة ← انقلها إلى خانات السهول أو الأراضي العشبية ← انقر على "إنشاء التحسين" ← اختر المزرعة ← اترك العامل هناك حتى تنتهي.

Create a trade route! = إنشاء طريق التجارة!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = بناء الطرق بين عاصمتك ومدينة أخرى. أو قم بأتمتة العامل لديك ودعه يصل إلى ذلك في النهاية.

# Requires translation!
Conquer a city! = 
Bring an enemy city down to low health → Enter the city with a melee unit. = قم بإسقاط مدينة العدو إلى مستوى صحي منخفض → أدخل المدينة بوحدة قتال قريب.

Move an air unit! = تحريك وحدة الهواء!
Select an air unit → Select another city within range → Move the unit to the other city. = حدد وحدة جوية → حدد مدينة أخرى ضمن النطاق → انقل الوحدة إلى المدينة الأخرى.

See your stats breakdown! = انظر تفاصيل الإحصائيات الخاصة بك!
Enter the Overview screen (top right corner) → Click on 'Stats'. = أدخل إلى شاشة النظرة العامة (الزاوية اليمنى العليا) ← انقر على "الإحصائيات".


