Askia = أسكيا
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = أنت رجس السماء والأرض، رئيس المتوحشين الجاهلين! يجب أن يتم تدميرك!
Fool! You have doomed your people to fire and destruction! = أحمق! لقد حكمت على شعبك بالنار والدمار!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = لقد استهلكتنا نيران الكراهية والغضب. استمتع بانتصارك في هذا العالم - ستدفع ثمنا باهظا في العالم التالي!
This insult shall cost you. = هذه الإهانة ستكلفك.
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = أنا أسكيا من السونغاي. نحن شعب عادل - ولكن من يتجاوزنا لن يجد إلا الدمار. من الأفضل أن تتجنب تكرار الأخطاء التي ارتكبها الآخرون في الماضي.
Can I interest you in this deal? = هل يمكنني أن أثير اهتمامك بهذه الصفقة؟
# Requires translation!
River Warlord = 
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = أسكيا، زعيم شعب السونغاي والأعظم على الإطلاق، ليراقب الله طريقك نحو المجد! كانت سونغاي تحت حكم دولة مالي القوية في غرب إفريقيا حتى منتصف القرن الرابع عشر. حارب الملك العظيم سني علي بير من أجل الاستقلال، وأظهر قوة سونغاي للجميع، من خلال غزو الأراضي وصد العديد من الأعداء الذين سعوا إلى تدمير المملكة الصاعدة. في نهاية المطاف، أدى الاستيلاء على مدينتي تمبكتو وجين الغنيتين إلى جعل سونغاي إمبراطورية ذات قوة اقتصادية كافية للبقاء على قيد الحياة لمدة قرن من الزمان، حتى انحنت الإمبراطورية أمام الأعداء ذوي التكنولوجيا المتقدمة - البنادق ضد الرماح.
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = أيها الملك أسكيا، شعبك يعلم أنه لا يزال هناك أمل، وأن ساعة الانتقام قادمة. امنحهم الثروة والقوة، وامنحهم أسلحة جبارة من الحديد والنار، لتدمير أي عدو، وإحياء سونغاي! هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
