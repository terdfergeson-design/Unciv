Otto von Bismarck = أوتو فون بسمارك
I cannot wait until ye grow even mightier. Therefore, prepare for war! = لا أستطيع الانتظار حتى تصبح أقوى. لذلك الاستعداد للحرب!
Corrupted villain! We will bring you into the ground! = الشرير الفاسد! سوف ننزلك إلى الأرض!
Germany has been destroyed. I weep for the future generations. = لقد تم تدمير ألمانيا. أبكي على الأجيال القادمة.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = تلك الشجاعة البرية؟ إنها قنبلة موقوتة، خاصة عندما تنبحون ولا تعضون!
Guten Tag. In the name of the great German people, I bid you welcome. = علامة جوتن. باسم الشعب الألماني العظيم أرحب بكم.
It would be in your best interest, to carefully consider this proposal. = سيكون من مصلحتك أن تدرس هذا الاقتراح بعناية.
What now? = ماذا الآن؟
So, out with it! = لذا، اخرج معها!
Furor Teutonicus = غضب تيوتونيكوس
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = كل التحية لأوتو فون بسمارك، المستشار الأول لألمانيا وإمبراطوريتها! خلال العصر القديم، كانت ألمانيا أرضًا مجزأة إلى عدة قبائل ولكنها أظهرت بالفعل وعدًا كبيرًا حيث كافحت الإمبراطورية الرومانية نفسها لإخضاع الألمان لإرادتها. تم بناء ألمانيا، كدولة واحدة، ببطء على أنقاض الإمبراطورية الرومانية المقدسة، وانتظرت عام 1871 حتى يتم توحيدها أخيرًا بعد النصر المجيد على فرنسا ونابليون الثالث. الشعب الألماني مبدع وذكي ومجتهد وأثبت عبر التاريخ أنه محارب موهوب. على الرغم من الكوارث والإخفاقات الكبيرة في النصف الأول من القرن العشرين، يمكن لألمانيا دائمًا الاعتماد على إرادة شعبها وقوته لتكون من بين أعظم وأقوى الدول في العالم.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = الأمير العظيم بسمارك، المجد والقوة هما في قلب الأمة الألمانية. إن شعبك ذكي، ويمنحك إرادته الحديدية لقيادة ألمانيا مرة أخرى. هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
