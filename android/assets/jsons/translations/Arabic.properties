Ashurbanipal = 

The general Askia turned the Songhai nation into the most powerful state of West Africa, bringing a golden age of religion and knowledge. = حول الجنرال أسكيا أمة السونغاي إلى أقوى دولة في غرب إفريقيا، مما أدى إلى عصر ذهبي للدين والمعرفة.

'The Scourge of God' united the Hunnic tribes, and led them to great wealth and glory, antagonizing the Romans across his borders relentlessly. = وحدت "آفة الله" قبائل الهون، وقادتهم إلى ثروة ومجد كبيرين، مما أدى إلى استعداء الرومان عبر حدوده بلا هوادة.

The creator of the Pax Romana and the Roman Empire, who ended a long civil war and brought peace to the entire Mediterranean, possibly the greatest emperor of Rome. = خالق باكس رومانا والإمبراطورية الرومانية، الذي أنهى حربًا أهلية طويلة وجلب السلام إلى البحر الأبيض المتوسط بأكمله، وربما أعظم إمبراطور روما.

The successful political career of the Iron Chancellor cannot be undermined, for he united Germany as we know it today, in his own way. = لا يمكن تقويض الحياة السياسية الناجحة للمستشار الحديدي، لأنه وحد ألمانيا كما نعرفها اليوم، بطريقته الخاصة.

The noble warrior fought with bravery and courage to gain the freedom of the Celtic people from the Roman subjugation, inspiring many others after her. = قاتلت المحاربة النبيلة بشجاعة وشجاعة لنيل حرية الشعب السلتي من القهر الروماني، وألهمت الكثيرين من بعدها.

