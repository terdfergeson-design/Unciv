Achaemenid Legacy = 
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = الملك العظيم داريوس ملك فارس، السماء تلقي نورها عليك! الشعب الفارسي قوي وحكيم كزعيم له. في العصور القديمة، حارب الملك الفارسي العظيم كورش الإمبراطورية الميدية الجبارة ودمر الميديين أخيرًا في عام 550 قبل الميلاد. وساعدت الدبلوماسية الماكرة والإنجازات العسكرية في ذلك الوقت في التغلب على ليديا الغنية وبابل القوية، وهو ابن كورش الذي غزا مصر الأبدية بعد بضع سنوات. وفي ذروة قوتها، وصلت الإمبراطورية الفارسية إلى شواطئ مقدونيا، عند باب دول المدن اليونانية الناشئة. كان من الممكن أن تزدهر بلاد فارس لعدة قرون لو لم يقم الإسكندر المقدوني بتدمير الإمبراطورية العظيمة بوحشية في ضربة عنيفة واحدة.
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = الملك داريوس، شعب بلاد فارس ينتظر، مشتاقًا لمجدها وقوتها الماضية! يجب أن تولد بلاد فارس الخالدون من جديد لمعاقبة أعدائها وإعادة بناء برسيبوليس اللامعة! هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
