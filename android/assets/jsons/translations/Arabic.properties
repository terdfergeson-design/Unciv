Phoenician Heritage = 
Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = تحياتي لك أيتها الملكة ديدو المبجلة حاكمة مملكة قرطاج الأسطورية. روى الشاعر الكبير فيرجيل تاريخك العظيم، وكيف قُتل زوجك أكربا على يد أخيك، الملك بيجماليون ملك صور، لسرقة كنوز عائلتك التي كانت ملكك الشرعي. لكنك تحملت ضغوطه حتى قررت أنت وأبناء وطنك الفرار والإبحار إلى أراضٍ جديدة. قادتك الآلهة إلى شواطئ شمال إفريقيا، وبدبلوماسية ماكرة، قمت بتوسيع أراضي موطنك الجديد، ووضعت الأساس لمملكة قرطاج المستقبلية.
Clever and proud Dido, the storm is coming and your people look for a shelter under your wise and powerful protection. Can you create a new and radiant Carthage able to cleave the darkness? Will your new empire shine through the ages of history? = ديدو الذكي والفخور، العاصفة قادمة وشعبك يبحث عن ملجأ تحت حمايتك الحكيمة والقوية. هل يمكنك إنشاء قرطاج جديدة ومشرقة قادرة على شق الظلام؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
