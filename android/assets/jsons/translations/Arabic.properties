### DoNotSpreadReligion 

Please don't spread your religion to us. = من فضلك لا تنشر دينك بيننا.
Very well, we shall spread our faith elsewhere. = حسنًا، سننشر إيماننا في مكان آخر.
We shall do as we please. = سنفعل كما يحلو لنا.
We noticed you have continued spreading your religion to us, despite your promise. This will have....consequences. = لقد لاحظنا أنك واصلت نشر دينك بيننا، رغم وعدك. وهذا سيكون له....عواقب.
[civName] agreed to stop spreading religion to us! = وافق [civName] على التوقف عن نشر الدين فينا!
