The Hakkapeliittas will ride again and your men will fall just at the sight of my cavalry! God with us! = سوف يركب الهاكابيليتاس مرة أخرى وسيسقط رجالك بمجرد رؤية فرساني! الله معنا!
Ha ha ha, captain Gars will be very glad to head out to war again. = هاهاها، سيكون الكابتن جارس سعيدًا جدًا بالخروج إلى الحرب مرة أخرى.
I am Sweden's king. You can take my lands, my people, my kingdom, but you will never reach the House of Vasa. = أنا ملك السويد. يمكنك أن تأخذ أرضي، شعبي، مملكتي، لكنك لن تصل أبدًا إلى بيت فاسا.
You actually seem sharper than what I had originally thought. = أنت في الواقع تبدو أكثر وضوحًا مما كنت أعتقده في الأصل.
Stranger, welcome to the Snow King's kingdom! I am Gustavus Adolphus, member of the esteemed House of Vasa = أيها الغريب، مرحباً بك في مملكة ملك الثلج! أنا جوستافوس أدولفوس، عضو مجلس فاسا الموقر
