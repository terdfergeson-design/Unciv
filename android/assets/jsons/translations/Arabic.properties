Harald Bluetooth = هارالد بلوتوث
If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = لكي أكون صادقًا، لقد سئمت من تلك المهزلات التي لا طائل من ورائها. لماذا لا نحل خلافاتنا في ساحة المعركة مثل الرجال الحقيقيين؟ ربما سيتغنى السكالد بشجاعتك... أو شجاعتي!
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = اهاها! يبدو أنك تُظهر بعض مهارات الفايكنج الحقيقي! من المؤسف أنني ربما سأقتلك!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = لا بد أن لوكي وقف إلى جانبك، لأن الرجل العادي وحده لم يكن يستطيع هزيمتي... حسنًا! سأنضم إلى إينهيرجار في فالهالا وأقيم وليمة، بينما أنت تكدح هنا.
Our future battle will be glorious! = معركتنا المستقبلية ستكون مجيدة!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = يدعوك Harald Bluetooth إلى الترحيب بك في أراضيه، الفايكنج الذي لم تعرفه البحار والأراضي على الإطلاق! هاه هل أنت خائف ؟
This is a fine deal! Even a drunk beggar would agree! = هذه صفقة جيدة! حتى المتسول المخمور سيوافق على ذلك!
