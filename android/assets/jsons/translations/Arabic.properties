Combat = 
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = تتآكل الوحدات والمدن بسبب القتال، الأمر الذي يتأثر بعدد من القيم المختلفة. \n كل وحدة لها قيمة قتالية "أساسية" معينة، والتي يمكن تحسينها من خلال ظروف وترقيات ومواقع معينة.
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = تستخدم الوحدات قيمة "القوة" كقيمة قتالية أساسية عند الهجوم القتال القريب وعند الدفاع. \n عند استخدام هجوم بعيد المدى، سوف يستخدمون قيمة "القوة بعيدة المدى" بدلاً من ذلك.
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = يمكن تنفيذ الهجمات بعيدة المدى من مسافة بعيدة، اعتمادًا على قيمة "النطاق" للوحدة. \n بينما تسمح هجمات القتال القريب للمدافع بإلحاق الضرر بالمهاجم انتقامًا، فإن الهجمات بعيدة المدى لا تسمح بذلك.

