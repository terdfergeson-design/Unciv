Embassies = 
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = يؤدي إنشاء سفارة في عاصمة اللاعبين الآخرين إلى إظهار موقع عاصمتهم، وبالمثل يمكن للاعبين الآخرين الذين ينشئون سفارة في عاصمتك رؤية موقع عاصمتك.
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = وبالتالي تسمح السفارات بوضع الجواسيس في عاصمة اللاعبين الآخرين إذا تم تمكين التجسس.
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = مطلوب من السفارات المتبادلة السماح بالتجارة عبر الحدود المفتوحة وتوقيع اتفاقية البحث والميثاق الدفاعي.
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = سيؤدي إعلان الحرب على لاعب آخر أو إدانته إلى إزالة السفارات من عاصمتي اللاعبين. سيكون عليك إعادة إنشائها لاستخدام تأثيرها.
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = يمكن إعادة إنشاء سفارة في الدور التالي بعد إدانة من أي طرف، أما في حالة الحرب فيتطلب ذلك معاهدة سلام.
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = كن حذرًا عند قبول سفارة من لاعبين آخرين لأنهم قد يتجسسون على عاصمتك، أو قد يبدأون في التخطيط لمهاجمتك.
