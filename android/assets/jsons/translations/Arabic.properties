Montezuma I = مونتيزوما الأول
Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Die, die, die!) = شي-ميقا-كان! شي-ميقا-كان! شي-ميقا-كان! (يموت، يموت، يموت!)
Excellent! Let the blood flow in raging torrents! = ممتاز! دع الدم يتدفق في السيول الهائجة!
Monster! Who are you to destroy my greatness? = الوحش! من أنت حتى تدمر عظمتي؟
What do I see before me? Another beating heart for my sacrificial fire. = ماذا أرى أمامي؟ قلبٌ آخر ينبض لنيراني المضحية.
