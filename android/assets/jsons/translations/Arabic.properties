Hiawatha = هياواثا
You are a plague upon Mother Earth! Prepare for battle! = أنت الطاعون على الأرض الأم! الاستعداد للمعركة!
You evil creature! My braves will slaughter you! = أيها المخلوق الشرير! سوف يذبحك شجعاني!
You have defeated us... but our spirits will never be vanquished! We shall return! = لقد هزمتنا... لكن أرواحنا لن تُهزم أبدًا! سوف نعود!
Words alone cannot shake the roots of peace I have planted among my people. = الكلمات وحدها لا تستطيع أن تهز جذور السلام التي زرعتها بين شعبي.
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = تحياتي أيها الغريب. أنا هياواثا، المتحدث باسم الإيروكوا. إننا نسعى إلى السلام مع الجميع، ولكننا لا نتورع عن الحرب.
Does this trade work for you, my friend? = هل هذه التجارة تناسبك يا صديقي؟
The Great Warpath = مسار الحرب العظيم
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = تحياتي، هياواثا النبيلة، زعيمة أمم الإيروكوا الجبارة! لقد عاش شعبك بالقرب من بحيرة أونتاريو العظيمة والمقدسة منذ العصور القديمة، على أرض ستُعرف فيما بعد بمدينة نيويورك. منذ فترة طويلة، أصبحت الشعوب الخمسة سينيكا وأونونداغا وموهوك وكايوغاس وأونيدا أمة واحدة، وهي الهودينوسوني والإيروكوا. على الرغم من عدم وجود لغة مكتوبة، إلا أن الإيروكوا الحكيم هو الذي وضع قانون السلام العظيم، والذي يمكن اعتباره أول دستور مؤسس. لعقود من الزمن، حارب شعبك أعداء أقوياء، مثل الهورون، ثم المستعمرين الفرنسيين والإنجليز. مع عدد أقل من المحاربين والأسلحة الرديئة، لا يزال الإيروكوا على قيد الحياة ويسيرون على طريق السلام والوئام، حتى تلاشت طريقة معيشتهم تحت سحق دولة الولايات المتحدة الوليدة.
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = عظيم ساشم هياواثا، هل تسمع شكاوى شعبك؟ هل يمكنك إضاءة الطريق المؤدي إلى اتحاد الإيروكوا القديم؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
