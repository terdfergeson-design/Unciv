View change log = 
After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = بعد التحديث، قد ترغب في رؤية ما تغير. يحتوي "حول" في "الخيارات" على رقم الإصدار المرتبط بسجل التغيير. يمكنك أيضًا الاطلاع على هذه المعلومات من خلال النقر على رقم الإصدار في القائمة الرئيسية.

Differences from Civilization V = الاختلافات عن الحضارة V
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = التركيز على الإنتاج\nفي Civilization V، يتم حساب إنتاجية الغذاء في المدينة أولاً، ثم ينمو السكان عن طريق استهلاك الغذاء المخزن (النمو)، ثم يتم حساب الإنتاج، وهكذا يتم حساب الإحصائيات الأخرى واحدة تلو الأخرى. وهكذا، يستطيع المواطنون إنتاج المحاصيل بنفس الطريقة التي ولدوا بها. يتم تعيين تركيز المدينة على الإنتاج لتعيين المواطن حديث الولادة إلى تلة حتى يساهم في الإنتاج، ثم يتم إعادة تعيينه يدويًا إلى خانات النمو في الدور التالي. وبدلاً من ذلك، يمكنك تعيين تركيز المدينة على الذهب (على سبيل المثال مع سيرو دي بوتوسي)، أو الإيمان (على سبيل المثال مع جبل سيناء) أو أي شيء يحقق أكبر قدر من العائدات. في Unciv، يبدأ المواطنون في إنتاج العوائد فقط في الدور التالي، لذلك يمكنك تجاهل هذا المفهوم برمته.
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = قائمة انتظار العلم\nفي Civilization V، يتم حساب العائد العلمي بعد الإنتاج، لذلك إذا انتهيت من عنصر ووضعت العلم (أو الذهب) في قائمة الانتظار كإنشاء دائم، فسيتم تحويل فائض الإنتاج من العنصر إلى العلم (أو الذهب)، ولكن لن يتم استهلاك الإنتاج، لأن هذا لن يحدث مرة أخرى إلا في الدور التالي. من خلال استبدال بنائك الدائم على الفور بعنصر في الدور التالي، ستحصل على هذا العلم (أو الذهب) مجانًا. هذا لا ينطبق على Unciv، لذلك لا تهتم.
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = القنوات المزدوجة\nفي لعبة Civilization V، تبيع لك اللعبة نسخًا موجودة من المبنى قبل تقديم نسخة مجانية من المبنى. لذلك، إذا قمت ببناء قناة مياه في مدينة، ثم في دور اعتماد التقليد الكامل، قمت ببيع مبنى رخيص (مثل ضريح) مسبقًا، فلن تتمكن اللعبة من بيع أكثر من مبنى واحد في كل دور، وبالتالي ستحتفظ بقناتك المائية، جنبًا إلى جنب مع القناة المجانية الجديدة. لا ينطبق على Unciv.
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = القانونية Oxford\n في Civilization V، تعتبر العجائب الوطنية مثل جامعة أكسفورد مباني ثقافية، لذا يمكنك الحصول عليها مجانًا مع الشرعية. لا ينطبق على Unciv.
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = الطرق والحصون\nفي Civilization V، لا يمكنك استخدام الطرق والحصون في أراضي العدو. في Unciv، يمكنك استخدامها، لذا بدلاً من بنائها بلا وعي في كل مكان أثناء الحرب، عليك أن تقرر ما إذا كانت ستفيدك أكثر من خصومك ومتى.
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = تحويل المواطن\nفي Civilization V، يولد المواطن متدينًا إذا كانت المدينة الأم قد تم تحويلها بالفعل. ليس هذا هو الحال في Unciv، والذي يمكن أن يؤدي إلى تفكيك مؤقت للمدينة عندما تنمو.
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = المواطنون غير المعينين\n في الحضارة V، يعتبر المواطنون غير المعينين متخصصين، ويخضعون لنفس النوع من المكافآت (على سبيل المثال، قدرة كوريا). قد يكون من المفيد ترك المواطنين بدون تعيين، بدلاً من تعيينهم للخانات. لا ينطبق على Unciv.
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = بناء المستوطنين\nفي Civilization V، لا يمكن للمدن أن تتضور جوعًا عند بناء المستوطنين، لذا يمكنك تعيين جميع المواطنين لخانات الإنتاج ولا شيء لخانات الغذاء. في Unciv، يستمر المواطنون في استهلاك طعامين في كل دور.
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = هجوم القتال القريب المائية \n نتيجة لاستطلاع Discord، يمكن لوحدات القتال القريب المائية مهاجمة الوحدات البرية العسكرية على الشاطئ، على عكس لعبة Civilization V.
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = تحسينات الخانات\nفي Civilzation V، يبدأ العمال العمل على تحسين قيد الإنشاء في بداية الحركة. يغير Unciv هذا للسماح للاعبين بتعيين العمال على الخانات، ثم إعادة النظر وتغيير التحسينات أو نقلهم إلى مكان آخر.
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = رؤية الغابات والغابات \n في Unciv، يمكن رؤية الغابات والغابات بمقدار خانة واحدة خارج نطاق الرؤية. في الحضارة V، هذا هو سلوك التلال والجبال، ولكن ليس الغابات والأدغال، ومع ذلك يمكن للغابة والغابة أن تحجب التلال، ويمكن للتل + الغابة أن تحجب الجبل، مما يشير إلى أنهما على نفس الارتفاع. يعتبر هذا خطأً في منطق الرؤية الجيد التنظيم في Civilization V.
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = تدمير المدينة \n في Civilization V، لا يمكن للاعب أبدًا هدم أي من المدن التي أسسها. لا ينطبق على Unciv.

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = المدن المؤسسة\nالمستوطن هي وحدة يمكنها تأسيس مدينة جديدة. يمكنك بناء وحدة مستوطنين في مدينة لا يقل عدد سكانها عن شخصين، ثم نقلهم إلى موقع جيد لتأسيس مدينة جديدة. ستكون هذه عادةً طريقتك الرئيسية للحصول على المزيد من المدن.
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = تحويل الغذاء إلى إنتاج\nأثناء بناء المستوطنة، لن تنمو المدينة. وبدلاً من ذلك، يتم تحويل الغذاء الزائد (النمو) في اليوم الأول والثاني والرابع، ومن هناك في كل رابع، إلى إنتاج، مع فقدان بقية الغذاء الزائد.

