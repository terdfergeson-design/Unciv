George Washington = جورج واشنطن
Your wanton aggression leaves us no choice. Prepare for war! = إن عدوانكم الغاشم لا يترك لنا أي خيار. الاستعداد للحرب!
You have mistaken our love of peace for weakness. You shall regret this! = لقد أخطأتم في حبنا للسلام على أنه ضعف. سوف تندم على هذا!
The day...is yours. I hope you will be merciful in your triumph. = اليوم... لك. أتمنى أن تكون رحيما في انتصارك.
The people of the United States of America welcome you. = إن شعب الولايات المتحدة الأمريكية يرحب بكم.
Is the following trade of interest to you? = هل التجارة التالية تهمك؟
Well? = حسنا؟
Manifest Destiny = القدر الظاهر
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = الرئيس واشنطن، نحييكم ونحيي الحضارة الأمريكية الفخرية! بعد أن تحررت من الهيمنة البريطانية في القرن الثامن عشر، ثم تم تطهيرها وولدت من جديد بعد حرب أهلية رهيبة، أصبحت دولة الولايات المتحدة مستعدة للعب دورها العظيم في القرن العشرين. في ذروة قوتها، المنتصرة بعد حربين عالميتين رهيبتين، صعدت الولايات المتحدة الأمريكية، أرض الهجرة والفرص والتفاؤل والتصميم، فوق كل الدول الضعيفة الأخرى، غير القادرة على مضاهاة هذه القوة.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = الرئيس واشنطن، هل ستظهر للعالم شرعية أسلوب الحياة الأمريكي، وتنشر شعلة الحرية للبشرية جمعاء؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
