'The new electronic interdependence recreates the world in the image of a global village.' - Marshall McLuhan = "إن الترابط الإلكتروني الجديد يعيد خلق العالم في صورة قرية عالمية." - مارشال ماكلوهان
Globalization = العولمة
'1. A robot may not injure a human being or, through inaction, allow a human being to come to harm. 2. A robot must obey any orders given to it by human beings, except when such orders would conflict with the First Law. 3. A robot must protect its own existence as long as such protection does not conflict with the First or Second Law.' - Isaac Asimov = '1. لا يجوز للروبوت أن يؤذي إنسانًا، أو أن يسمح للإنسان، من خلال التقاعس عن العمل، بإلحاق الأذى به. 2. يجب على الروبوت أن يطيع أي أوامر يصدرها له البشر، إلا عندما تتعارض هذه الأوامر مع القانون الأول. 3. يجب على الروبوت أن يحمي وجوده طالما أن هذه الحماية لا تتعارض مع القانون الأول أو الثاني. - إسحاق عظيموف
Robotics = علم الروبوتات
'Now, somehow, in some new way, the sky seemed almost alien.' - Lyndon B. Johnson = "الآن، بطريقة ما، وبطريقة جديدة، بدت السماء غريبة تقريبًا." - ليندون جونسون
Satellites = الأقمار الصناعية
'Be extremely subtle, even to the point of formlessness, be extremely mysterious, even to the point of soundlessness. Thereby you can be the director of the opponent's fate.' - Sun Tzu = "كن دقيقًا للغاية، حتى إلى درجة انعدام الشكل، وكن غامضًا للغاية، حتى إلى درجة انعدام الصوت. وبذلك يمكنك أن تكون مديرًا لمصير الخصم. - صن تزو
Stealth = التخفي
'Our scientific power has outrun our spiritual power, we have guided missiles and misguided men.' – Martin Luther King Jr. = "لقد تجاوزت قوتنا العلمية قوتنا الروحية، لقد وجهنا الصواريخ والرجال المضللون." - مارتن لوثر كينغ جونيور.
Advanced Ballistics = المقذوفات المتقدمة

'Every particle of matter is attracted by or gravitates to every other particle of matter with a force inversely proportional to the squares of their distances.' - Isaac Newton = "كل جسيم من المادة ينجذب أو ينجذب إلى كل جسيم آخر من المادة بقوة تتناسب عكسيا مع مربعات المسافة بينهما." - إسحاق نيوتن
Particle Physics = فيزياء الجسيمات
'The release of atomic energy has not created a new problem. It has readily made more urgent the necessity of solving an existing one.' - Albert Einstein = "إن إطلاق الطاقة الذرية لم يخلق مشكلة جديدة. لقد جعلت من ضرورة حل المشكلة القائمة أكثر إلحاحًا. - ألبرت أينشتاين
Nuclear Fusion = الاندماج النووي

'The impact of nanotechnology is expected to exceed the impact that the electronics revolution has had on our lives.' - Richard Schwartz = "من المتوقع أن يتجاوز تأثير تكنولوجيا النانو تأثير ثورة الإلكترونيات على حياتنا." - ريتشارد شوارتز
