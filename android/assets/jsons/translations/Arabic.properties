#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = مرحبًا بك في Unciv!\n نظرًا لأن هذه لعبة معقدة، فهناك مهام أساسية لمساعدتك في التعرف على اللعبة. \n هذه المهام اختيارية تمامًا، ونحن نرحب بك لاستكشاف اللعبة بنفسك!

# Requires translation!
Welcome to Unciv! = 
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = ونظرًا لأن هذه لعبة معقدة، فهناك بعض البرامج التعليمية لمساعدتك في التعرف عليها. يمكن تعطيلها في الخيارات -> قائمة العرض، ولكن يرجى الانتظار إذا كنت جديدًا هنا!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = مهمتك الأولى هي العثور على عاصمتك. هذه في الواقع مهمة مهمة لأن عاصمتك ستكون على الأرجح الأكثر ازدهارًا. تنطبق العديد من مكافآت اللعبة فقط على عاصمتك، وستكون مركز إمبراطوريتك.
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = كيف تعرف أن موقع المدينة مناسب؟ ولحسن الحظ، فقد اختارت اللعبة بالفعل موقعًا جيدًا لك. يمكنك الاستقرار في هذا المكان، أو ربما الانتقال إلى مكان موجود على تلة (للإنتاج والدفاع) أو بجوار جبل (للوصول إلى مبنى المرصد لاحقًا).
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = من المحتمل أنك ستحتاج إلى المزيد من المدن لاحقًا. بالنسبة لهذه المدن، يجب عليك الذهاب والعثور على مكان جيد. يعد البحث عن الموارد الفاخرة والتأسيس عليها أو بالقرب منها قاعدة جيدة.
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = الموارد الفاخرة هي مربعات تحتوي على أشياء مثل الجواهر أو القطن أو الحرير (يُشار إليها بخلفية صفراء لأيقونة المورد). هذه الموارد تجعل حضارتك سعيدة. يجب عليك أيضًا مراقبة الموارد اللازمة لبناء الوحدات، مثل الحديد. لا يمكن بناء المدن ضمن 3 خانات من المدن الحالية، وهو شيء آخر يجب أخذه في الاعتبار!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = ستأوي المدن المواطنين الذين يمكنهم عمل الخانات على مسافة تصل إلى 3 خانات بعيدًا عن المدينة. هذا يعني أنك لست مضطرًا إلى تسوية المدن مباشرة على الخانات الجيد أو بجواره. لنفترض، على سبيل المثال، أنك تريد الوصول إلى بعض الحديد - ولكن المورد موجود في منطقة صحراوية. ليس عليك أن تستقر مدينتك في الصحراء. يمكنك تسوية بضعة خانات في الأراضي الأكثر ازدهارًا. سوف تنمو مدينتك وستتمكن في النهاية من الوصول إلى المورد. ما عليك سوى الاستقرار على الموارد مباشرة إذا كنت في حاجة إليها على الفور.
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = أول شيء يخرج من مدينتك يعتمد على الإستراتيجية التي تريد اتباعها، ولكن ترتيب البناء "الكلاسيكي" هو بناء أول كشافتين، ثم ضريح، وثلاثة مستوطنين، واعتماد التقليد، لاستكشاف الخريطة بسرعة (يتجاهل الكشافة تكلفة التضاريس)، والحصول على البانثيون المبكر (إذا كنت تلعب مع تمكين الدين).
But feel free to experiment with your own build orders! = لكن لا تتردد في تجربة أوامر البناء الخاصة بك!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = في أول دورين لك، سيكون لديك خيارات قليلة جدًا، ولكن مع نمو حضارتك، يزداد أيضًا عدد الأشياء التي تتطلب اهتمامك.

# Requires translation!
Culture and Policies = 
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = في كل دور، تتم إضافة الثقافة التي تكتسبها من جميع مدنك إلى ثقافة حضارتك. \n عندما يكون لديك ما يكفي من الثقافة، يمكنك اختيار سياسة اجتماعية، كل واحدة منها تمنحك مكافأة معينة.
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = يتم تنظيم السياسات في فروع، حيث يوفر كل فرع قدرة إضافية عند اعتماد جميع السياسات في الفرع.
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = مع اعتماد كل سياسة، ومع بناء كل مدينة، ترتفع تكلفة اعتماد سياسة أخرى، \n - لذا اختر بحكمة!

# Requires translation!
City Expansion = 
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = بمجرد أن تجمع المدينة ما يكفي من الثقافة، فإنها ستتوسع إلى خانة مجاورة. \n ليس لديك سيطرة على الخانة التي ستتوسع إليها، ولكن يتم إعطاء الأولوية للخانات ذات الموارد والإنتاجية الأعلى.
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = سيتطلب كل خانات إضافي مزيدًا من الثقافة، ولكن عمومًا ستتوسع مدنك الأولى في النهاية لتشمل نطاقًا واسعًا من الخانات.
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = على الرغم من أن مدينتك ستستمر في التوسع إلى الأبد، إلا أن مواطنيك يمكنهم العمل على بعد 3 خانات فقط من مركز المدينة. \n يجب أن يؤخذ هذا في الاعتبار عند إنشاء مدن جديدة.

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = الغذاء هو المورد الأساسي لمدنكم، وبالتالي للأمة والسكان والصحة.
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = يستهلك كل مواطن في كل مدينة الغذاء في كل دور. أي متبقي يعتبر نموًا ويتم تخزينه في وسط المدينة. بمجرد تراكم ما يكفي، تنمو المدينة ويضاف مواطن جديد.
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = في البداية، المصدر الرئيسي للطعام هو مركز المدينة نفسه والعمل في منطقة محيطة مع أحد المواطنين. يمكنك زيادة مقدار ما يتم إنشاؤه عن طريق كسب المزيد من المواطنين للعمل على المزيد من الخانات، وتحسين الخانات بحيث ينتج المزيد من الغذاء، وفي النهاية المباني والسياسات.
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = نظرًا لأن عدد المواطنين أو السكان في المدينة يحدد عدد الخانات التي يمكن أن تعمل بها المدينة، فغالبًا ما يكون الغذاء هو المورد الأكثر أهمية.

Production is the resource that lets a City Center build new things. = الإنتاج هو المورد الذي يتيح لمركز المدينة بناء أشياء جديدة.
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = يمكن أن تكون هذه مباني جديدة تمت إضافتها إلى مركز المدينة، أو وحدات جديدة يمكن نشرها عبر خريطة العالم لتعزيز أهداف أمتك.
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = لكل ما يمكنك بناؤه تكلفة إنتاج. في كل دور، تولد كل مدينة قدرا من الإنتاج وتخصصه للعنصر الأول في قائمة البناء. وعند بلوغ التكلفة الكاملة، يكتمل المبنى أو الوحدة!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = أي فائض في الإنتاج بعد بناء شيء ما ينتقل إلى الشيء التالي الذي تبنيه المدينة. يصل إلى إجمالي تكلفة الإنتاج.
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = وبما أن هذا يحدد مدى السرعة التي يمكنك بها بناء المزيد من الأشياء، فإن القدرة الإنتاجية لدولتك أمر بالغ الأهمية لتقدمها وبقائها.

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾العلم هو المورد الذي يفتح تقنيات جديدة ومثيرة لأمتك.
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = بعد تأسيس عاصمتك، سيُطلب منك اختيار تقنية لبحثها.
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = لكل تقنية تكلفة من ⍾العلم. في كل دور، يُخصص ⍾العلم الذي تنتجه حضارتك لبحث التقنية التي اخترتها.
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = بمجرد أن يتم دفع تكلفة التكنولوجيا بالكامل، يمكنك فتح المزايا لدولتك! قد تكون هذه وحدات أو مباني جديدة أو مزايا أخرى. أي فائض سوف يتدفق إلى التكنولوجيا التالية التي تختارها للبحث.
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = إن البحث عن تقنية في العصر التالي سوف ينقلك إلى ذلك العصر ويؤدي إلى إشعار الدول الأخرى حول مدى روعتك!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = نظرًا لأن التقنيات الجديدة تميل إلى منح إمكانية الوصول إلى وحدات ومباني أفضل وحتى فتح سياسات جديدة قوية، فإن البقاء في صدارة المنافسة يعد أحد أفضل الطرق لتأمين انتصارك!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = آه الذهب. الوسيلة العالمية للتبادل. الجميع يحب الذهب! يقولون أنها لا تستطيع شراء السعادة، لكن الغواصات النووية جيدة بنفس القدر تقريبًا.
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = يمكنك ربح المزيد من الذهب من الخانات والموارد والتحسينات وفي النهاية المباني والمتخصصين وطرق التجارة. تعد الآثار القديمة والالتقاء بدول المدن الجديدة وعمليات النهب أيضًا مصادر رائعة للذهب. خلال العصر الذهبي، كل قطعة تنتج الذهب بالفعل سوف تنتج ذهبًا إضافيًا!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = يُستخدم الذهب لدفع تكاليف صيانة المباني وشبكة النقل وإعالة الوحدات. إذا نفد الذهب، ينخفض إنتاج ⍾العلم أولا، ثم تبدأ وحداتك بالتسريح لأنك لا تستطيع دفع تكلفة إعالتها.
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = يمكن استخدام الذهب لشراء المباني والوحدات، مما يساعد على تطوير مدينة جديدة أو إنشاء جيش بسرعة. ويمكن استخدامه أيضا لشراء خانات تُضاف إلى مدينتك، ولتحديث وحداتك القديمة إلى أنواع أحدث وأقوى. واستثماره في اتفاقية بحث وسيلة ممتازة لتحويله إلى ⍾العلم.
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = الذهب أيضًا ذو قيمة كبيرة في الدبلوماسية. يمكنك إهداء الذهب مباشرةً إلى دول المدن لكسب مصلحتهم. استخدمه لموازنة الصفقة التجارية مع الدول الأخرى. أو اطلب كل قطرة أخيرة بعد حرب ناجحة ويطالب عدوك بالسلام.
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = ومن المفارقات أن البعض قد يعتبر الذهب أحد الموارد الأقل أهمية. لكن الطبيعة المرنة وأهمية الحفاظ على استمرارية أمتك تجعل من الأمر أمرًا ثمينًا يجب الاهتمام به. بعد كل شيء، الجميع يحب الذهب.
Not to be confused with the Resource of the same name, Gold Ore = لا ينبغي الخلط بينه وبين المورد الذي يحمل نفس الاسم، خام الذهب
