You stand in the way of my armies. Let us solve this like warriors! = أنت تقف في طريق جيوش بلدي. دعونا نحل هذا مثل المحاربين!
No more words. Today, Mongolia charges toward your defeat. = لا مزيد من الكلمات. اليوم، منغوليا تتجه نحو هزيمتكم.
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = لقد أعاقت العشائر المنغولية. احترامي لك يكاد يتطابق مع الكراهية. أنا في انتظار إعدامي.
Your bravery must be commended. = يجب الثناء على شجاعتك.
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = أنا تيموجين، فاتح المدن والبلدان. أمامي تكمن الأراضي المنغولية المستقبلية. ورائي هو سلاح الفرسان الوحيد الذي يهم.
I am not always this generous, but we hope you take this rare opportunity we give you. = أنا لست دائمًا بهذا السخاء، ولكننا نأمل أن تغتنم هذه الفرصة النادرة التي نقدمها لك.
