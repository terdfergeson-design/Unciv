Ramesses II = رمسيس الثاني
You are but a pest on this Earth, prepare to be eliminated! = أنتم مجرد آفة على هذه الأرض، استعدوا للتخلص منها!
You are a fool who evokes pity. You have brought my hostility upon yourself and your repulsive civilization! = أنت أحمق الذي يثير الشفقة. لقد جلبت عداوتي لنفسك ولحضارتك البغيضة!
Strike me down and my soul will torment yours forever, you have won nothing. = اضربني وسوف تعذب روحي روحك إلى الأبد، فأنت لم تفز بشيء.
Greetings, I am Ramesses the god. I am the living embodiment of Egypt, mother and father of all civilizations. = تحياتي انا رمسيس الاله. أنا التجسيد الحي لمصر، أم وأب كل الحضارات.
Generous Egypt makes you this offer. = مصر الكريمة تقدم لكم هذا العرض .
Good day. = يوم جيد.
Oh, it's you. = أوه، هذا أنت.
Monument Builders = بناة النصب التذكارية
O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = أيها رمسيس العظيم، فرعون مصر، مشرق كالشمس وقوي كالنيل! يا رب كل الكائنات الحية، أنت تقود أعظم الحضارات التي منحت العالم الكتابة والرياضيات المتقدمة والنحت والهندسة المعمارية. سوف تستمر الآثار والثقافة المصرية في إدهاش العالم لآلاف السنين.
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = رمسيس العظيم والأبدي، استمرت مصر لآلاف السنين، في حين اختفت الحضارات الأخرى وتحولت إلى رماد بعد بضعة قرون. آمون رع يباركك مرة أخرى لقيادة مصر وشعبها على طريق النور. هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
