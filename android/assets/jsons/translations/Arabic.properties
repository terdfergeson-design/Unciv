'Industrialization based on machinery, already referred to as a characteristic of our age, is but one aspect of the revolution that is being wrought by technology.' - Emily Greene Balch = "إن التصنيع القائم على الآلات، والذي يشار إليه بالفعل على أنه سمة من سمات عصرنا، ليس سوى جانب واحد من الثورة التي تحدثها التكنولوجيا." - إميلي جرين بالش
