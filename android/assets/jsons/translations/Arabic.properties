Welcome. = 
# Requires translation!
Father Governs Children = 
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = أيها الملك العظيم رامخامهاينج، الشعب السيامي يطيعك باحترام وخوف! أرض سيام الجميلة والغامضة هي بلد قديم يقع في قلب جنوب شرق آسيا، وقد حاصره العديد من الأعداء، وابتلي بحرب دامية وفقر مدقع، ولكن في النهاية صمد الشعب السيامي الذكي والمخلص وانتصر. كانت سيام جزءًا من إمبراطورية الخمير حتى القرن الثالث عشر الميلادي، قبل أن يحمل شعبها الشجاع السلاح ويقود ثورة لتشكيل مملكة سوخوثاي الصغيرة. وبعد العديد من المعارك والبراعة الدبلوماسية، أصبحت هذه المملكة الصغيرة إمبراطورية عظيمة، والتي من شأنها أن تهيمن على جنوب شرق آسيا لأكثر من قرن من الزمان.
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = الملك الحكيم والقوي رامخامهاينج، شعبك يريد إحياء أيام المجد هذه! هل يمكنك عمل فجر جديد في سيام؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
