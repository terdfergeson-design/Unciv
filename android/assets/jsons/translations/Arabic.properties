Kamehameha I = كاميهاميها الأول
The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = إن النار القديمة التي تومض عبر السماء هي التي أعلنت أن هذا اليوم سيأتي، على الرغم من أنني كنت أتمنى بحماقة الحصول على نتيجة مختلفة.
It is obvious now that I misjudged you and your true intentions. = من الواضح الآن أنني أخطأت في الحكم عليك وعلى نواياك الحقيقية.
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = يستسلم السلطعون ذو القشرة الصلبة، ويستلقي الأسد لينام. كانالوا يأتي بالنسبة لي الآن.
The ocean's tide may rise and fall, but my resolve stands steady. = قد يرتفع مد المحيط وينخفض، لكن عزمي يظل ثابتًا.
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = الوها! تحية طيبة وسلام عليك أيها الصديق. أنا كاميهاميها، الملك العظيم لهذه السلسلة من الجزر.
Come, let our people feast together! = تعالوا، ودع شعبنا يحتفل معًا!
