### DoNotSettleNearUs 

Please don't settle new cities near us. = من فضلك لا تستوطن مدن جديدة بالقرب منا.
Very well, we shall look for new lands to settle. = حسنًا، يجب أن نبحث عن أراضٍ جديدة لنستوطنها.
We noticed your new city near our borders, despite your promise. This will have....implications. = لقد لاحظنا مدينتك الجديدة بالقرب من حدودنا، رغم وعدك. وسيكون لهذا.... آثار.
