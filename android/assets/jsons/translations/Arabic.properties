"Toasts" can be clicked to make them stay on the screen for easier reading. = يمكن النقر على "الخبز المحمص" لإبقائها على الشاشة لتسهيل القراءة.
Click it again to close (or use the close button). = انقر عليه مرة أخرى للإغلاق (أو استخدم زر الإغلاق).
