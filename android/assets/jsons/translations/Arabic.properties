Nobel Prize = 
All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = نحيي الجميع الملك العظيم غوستافوس أدولفوس، مؤسس الإمبراطورية السويدية، وأحد أشهر التكتيكيين العسكريين. في أوائل القرن السابع عشر، برزت السويد كقوة عظمى في أوروبا في عهدك، وذلك بفضل حكمتك، ​​سواء في الدبلوماسية أو الحرب. لقد قررت، كملك، إصلاح القوانين السويدية لتحقيق الاستقرار الاقتصادي والرخاء لشعبك. لقد أطلق عليك حلفاؤك، وكذلك أعداؤك، لقب "أسد الشمال"، وهو ما يشهد على رؤيتك الحديثة للحرب، وبراعة جيوشك في ساحة المعركة. عندما انتصرت في حرب الثلاثين عامًا، سيتم تذكر اسمك إلى الأبد كواحد من أعظم الجنرالات في التاريخ.
O noble King, will you lend your leadership and brilliant ideas to Sweden once again, to conceive strategies never seen before? Will your new empire shine through the ages of history? = هل ستعيد أيها الملك النبيل قيادتك وأفكارك الرائعة إلى السويد مرة أخرى لوضع استراتيجيات لم يسبق لها مثيل؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
