Diplomatic Marriage = 
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = الملكة ماريا تيريزا النبيلة والتقيّة، الإمبراطورة الرومانية المقدسة وسيادة النمسا، الشعب يقدس نعمتك. بعد وفاة والدك الملك تشارلز السادس، ورثت عرش النمسا خلال الأوقات الاقتصادية والعسكرية الصعبة. لكنك استخدمت حكمتك وتصميمك الذي لا يتزعزع لدرء أعدائك وإزالة أي عقبات أمام الاستقرار والازدهار. بوجود زوجك فرانسيس ستيفن إلى جانبك كحاكم مشارك، ضمنت مكانتك كإمبراطورة للإمبراطورية الرومانية المقدسة. في عهدك، قمت بإصلاح النمسا في عدة مجالات، حيث منحتها جيشا قويا، ونموذجا اقتصاديا مستقرا، ونظاما تعليميا محسنا.
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = أيتها الملكة العظيمة، العزّة والكرامة، بإرادة الله والحق الإلهي، هل تستطيعين أن تبلغي ذروة الرخاء والروعة التي تستحقها مملكة النمسا؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
