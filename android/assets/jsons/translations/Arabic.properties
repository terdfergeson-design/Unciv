Alexander the Great, born in Macedon, was one of the most skilled generals, even more by his young age, and in only 17 years he conquered all the Greek known world. = كان الإسكندر الأكبر، المولود في مقدونيا، أحد أمهر الجنرالات، بل وأكثر من ذلك بصغر سنه، وفي 17 عامًا فقط غزا كل العالم اليوناني المعروف.

