Patriarchate of Constantinople = 
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = الإمبراطورة العظيمة ثيودورا، محبوبة بيزنطة وروما، شعبك يحييك! بجمالك وذكائك، ارتقيت من ممثلة ومحظية إلى مرتبة أقوى امرأة في الإمبراطورية الرومانية، كزوجة لجستنيان الأول. وفي أواخر عام 520 ميلادي، ساعدت زوجك على الانخراط في إصلاحات روحية وقانونية، وأصدرت العديد من القوانين لتحسين وضع المرأة ومعاملتها في الإمبراطورية. لقد جعلتم أيضًا من القسطنطينية جوهرة الإمبراطورية الرومانية الشرقية من خلال ترميم وبناء العديد من القنوات والجسور والكنائس، وبلغ جمالها ذروته بإنشاء آيا صوفيا، واحدة من أروع القطع المعمارية في العالم.
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = الإمبراطورة الجميلة، روعة الإمبراطورية البيزنطية لا تزال سليمة في جميع الذكريات، وجاهزة لإعادة الميلاد كجوهرة جديدة للبشرية. هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
