After Conquering = 
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = عند احتلال مدينة ما، يمكنك اختيار تحرير المدينة أو ضمها أو تحويلها إلى دمية أو تدميرها.
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nيعيد تحرير المدينة ملكيتها إلى صاحبها الأصلي ويحسن علاقتك الدبلوماسية معه كثيرا!\n\nيمنحك ضم المدينة سيطرة كاملة عليها، لكنه يضاعف تعاسة سكانها!\nيمكن تخفيف ذلك ببناء محكمة في المدينة، مما يعيد تعاسة السكان إلى مستواها الطبيعي.\n\nجعل المدينة تابعة يعني أنك لا تتحكم في إنتاجها.\nلن تزيد المدينة تكلفة التقنيات أو السياسات.\nيمكن ضم المدينة التابعة في أي وقت، لكن لا يمكن إعادة المدينة المضمومة إلى حالة التبعية!\n\nيقلل هدم المدينة سكانها بمقدار 1 في كل دور حتى تُدمر!\nلا يمكن هدم عاصمة أصلية لحضارة أو مدينة مقدسة لديانة.

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = لقد واجهت وحدة بربرية! \n يهاجم البرابرة الجميع بشكل عشوائي، لذا لا تدع وحدات \n المدنية تقترب منهم، وكن حذرًا من مستكشفك!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = لقد واجهت حضارة أخرى!\nالحضارات الأخرى تبدأ سلمية، ويمكنك التجارة معهم،\n لكنهم قد يختارون إعلان الحرب عليك لاحقًا

