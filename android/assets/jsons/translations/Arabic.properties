Oh. It's you? = أوه. هذا أنت؟
Art of War = فن الحرب
Heaven itself bends before your beauty, Empress Wu Zetian, ruler of eternal China! You lead one of the oldest and greatest civilization of humanity. In your time, China stood at the forefront of science and technology, bringing the world such contributions as gunpowder, the printing press, and the world of Confucius, and this, long before the rest of the world was mature enough to make the same discoveries! = السماء نفسها تنحني أمام جمالك، الإمبراطورة وو تسه تيان، حاكمة الصين الأبدية! أنت تقود واحدة من أقدم وأعظم الحضارات الإنسانية. في زمنكم، وقفت الصين في طليعة العلم والتكنولوجيا، وقدمت للعالم مساهمات مثل البارود، والمطبعة، وعالم كونفوشيوس، وذلك قبل وقت طويل من نضج بقية العالم بما يكفي لتحقيق نفس الاكتشافات!
Great Queen, can you make China prevail again, using your divine intelligence and beauty? China stands for greatness, and all its enemies will be dazzled soon enough! Will your new empire shine through the ages of history? = أيتها الملكة العظيمة، هل يمكنك أن تجعل الصين تسود مرة أخرى، باستخدام ذكائك وجمالك الإلهي؟ الصين تمثل العظمة، وسوف يُبهر جميع أعدائها قريبًا بما فيه الكفاية! هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
