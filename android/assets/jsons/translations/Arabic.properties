# Requires translation!
Mongol Terror = 
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = يا تيموجين العظيم، القائد الخالد للإمبراطورية المغولية الجبارة! اسمك وحده كان كافياً لانهيار المدن، وصوت الفرسان المغول الجبارة كان كافياً لجعل أعدائك يفرون! يا خان العظيم! بمجرد أن اتحدت شمال آسيا في شعب عظيم، وأنتج واحدًا من أعظم الجيوش التي عرفها العالم على الإطلاق، غزا رماة الخيالة الماهرون في غضون سنوات قليلة معظم الصين وشرق آسيا، بل ووصلوا إلى أبواب أوروبا في الغرب. بفضل الدبلوماسية الماكرة والحرب الرائعة، اكتسحت أعداءك واحدًا تلو الآخر، وأنشأت أعظم إمبراطورية على الإطلاق، مما أدى إلى تقليص الفتوحات الرومانية أو اليونانية إلى إنجازات بسيطة.
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = تيموجين الإلهي، المعارك والفتوحات تجري في عروق المغول. هل أنت مستعد لتحطيم إرادة أعدائك؟ هل سيركب فرسانك في السهوب مرة أخرى ويضربون كالبرق والرعد؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
