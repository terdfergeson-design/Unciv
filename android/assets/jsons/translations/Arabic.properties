I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = أنا، فو كون رامخامهاينج، ملك سيام، أعتبره شرفًا عظيمًا أنك مشيت لزيارة بلدي سيام.
Greetings. I believe this is a fair proposal for both parties. What do you think? = تحياتي. وأعتقد أن هذا اقتراح عادل لكلا الطرفين. ماذا تعتقد؟
