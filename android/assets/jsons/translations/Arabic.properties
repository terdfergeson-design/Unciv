Pillaging = 
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = يمكن للوحدات العسكرية نهب التحسينات، مما يشفيها 25 صحة ويفسد التحسين. \n لا يزال من الممكن العمل على الخانات، ولكن المزايا من التحسين - المكافآت الإحصائية والموارد - ستفقد. \n يمكن للعمال إصلاح هذه التحسينات، الأمر الذي يستغرق وقتًا أقل من بناء التحسين من الصفر. \n سيؤدي جمع بعض التحسينات إلى قيام وحداتك بنهب الذهب من التحسين.

Experience = الخبرة
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = تكتسب الوحدات التي تشارك في القتال خبرة يمكن استخدامها لترقيتها.\nتكتسب الوحدات خبرة أكثر في القتال القريب مقارنة بالقتال عن بعد، وعند الهجوم مقارنة بالدفاع.
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = يمكن للوحدات الحصول على ما يصل إلى 30 XP فقط من الوحدات البربرية - مما يعني ما يصل إلى ترقيتين. بعد ذلك، لن تقدم الوحدات البربرية أي خبرة.

