### DontSpyOnUs 

Stop spying on us. = توقف عن التجسس علينا.
We see our people are not welcome in your lands... we will take our attention elsewhere. = نرى أن شعبنا غير مرحب به في أراضيكم... وسنوجه اهتمامنا إلى مكان آخر.
I'll do what's necessary for my empire to survive. = سأفعل ما هو ضروري لبقاء إمبراطوريتي.
Take back your spy and your broken promises. = استرد جاسوسك ووعودك المنكوثة.
