Welcome, friend. = 
# Requires translation!
Sacrificial Captives = 
O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = أيها مونتيزوما الإلهي، شعبك يرحب بك! نرجو أن يلهم عظمتك كل الكائنات الحية! كان الأزتيك الأقوياء من البدو الرحل حتى القرن الثاني عشر، عندما اختاروا الاستقرار في منطقة ميسا المركزية، والتي ستُسمى فيما بعد المكسيك. كانت الحروب متكررة مع القبائل الأخرى للسيطرة على الأراضي الغنية المحيطة ببحيرات تيكسكوكو وخالتوكان وزامبانغو المقدسة. في حوالي 200 عام، جعلت التحالفات الثنائية والبراعة القتالية من الأزتيك القوة المهيمنة في حوض أمريكا الوسطى، وشكلت إمبراطورية عظيمة تمتد من البحر إلى البحر. للأسف، سقطت الإمبراطورية تحت هجوم الشياطين الأجانب - الإسبان والعديد من اللعنات التي جلبوها معهم! أدت الحروب بين القبائل وأسلحة الدمار التي استخدمها الغزاة إلى انهيار حضارة الأزتك العظيمة في غضون بضعة عقود فقط.
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = أيها الملك العظيم مونتيزوما، هل تسمع نداء شعبك الذي يسعى للانتقام؟ هل ستقودهم إلى النصر تحت ضوء الشمس الخمسة؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
