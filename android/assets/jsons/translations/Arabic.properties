# Requires translation!
Embarking = 
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = بعد بحث التقنية المناسبة، يمكن لوحداتك البرية الإبحار وعبور الخانات المائية.\nيستغرق دخول الماء أو مغادرته دورا كاملا.
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = الوحدات غير قادرة على الدفاع أثناء الانطلاق (لا يمكنها استخدام المعدلات)، ولها قوة دفاع ثابتة بناءً على عصرك التكنولوجي، لذا كن حذرًا! لا تستطيع وحدات \nRanged الهجوم، ولدى وحدات القتال القريب عقوبة قوة، وجميعها لديها رؤية محدودة.

# Requires translation!
Idle Units = 
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to an unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = يؤدي النقر فوق "الوحدة التالية" إلى الانتقال إلى الوحدة الخاملة التالية في قائمة الانتظار (كما هو موضح في نظرة عامة -> الوحدات). بعد إصدار أمر لوحدة ما، إذا تم تمكين "دورة الوحدة التلقائية" في الخيارات -> طريقة اللعب، فسوف تقوم تلقائيًا بتحديد الوحدة الخاملة التالية.
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = إذا كنت لا تريد نقل وحدة في هذا الدور، فيمكنك تخطيها بالنقر فوق "الوحدة التالية" مرة أخرى، أو أمر الوحدة بـ "تخطي الدور".
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = إذا كنت تريد تعطيل ميزة "الوحدة التالية" تمامًا، فيمكنك تبديلها في الخيارات -> اللعب -> التحقق من الوحدات الخاملة.
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = إذا كنت تفضل "الوحدة التالية" لتدوير الوحدات وعدم وضع علامة "تم" عليها، فيمكنك تغييرها في الخيارات -> قائمة اللعب.
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = يمكنك أيضًا التنقل بين الوحدات الخاملة باستخدام المثلثين الأيسر والأيمن على جدول الوحدات الموجود في الجزء السفلي الأيسر من الشاشة. أو بشكل افتراضي باستخدام زر الدورة الموجود بجوار زر "الوحدة التالية".

