City Blockade = 

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = بمجرد أن تستقر في 3-4 مدن وتبني الجامعات، فمن المحتمل أن تكون قد أكملت 100 إلى 150 دور في اللعبة. \nالآن هو الوقت المناسب لبدء التفكير في الطريقة التي تريد بها الفوز بالضبط - إذا لم تكن قد فعلت ذلك بالفعل.
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = هناك أربع طرق للفوز في Unciv. وهم: \n - النصر الثقافي: أكمل 5 أشجار للسياسة الاجتماعية وابني مشروع اليوتوبيا \n - انتصار الهيمنة: قهر العاصمة الأصلي لجميع المدن الكبرى الأخرى \n - النصر العلمي: كن أول من يبني سفينة فضائية\n - النصر الدبلوماسي: قم ببناء الأمم المتحدة واربح التصويت
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = لتلخيص الأمر، هذه هي أساسيات Unciv – العثور على مدينة أولى مزدهرة، والتوسع ببطء لإدارة السعادة، وإعداد نفسك لحالة النصر التي ترغب في متابعتها. \n من الواضح أن هناك ما هو أكثر من ذلك بكثير، ولكن من المهم عدم القفز إلى النهاية العميقة قبل أن تعرف كيفية السباحة.

# Requires translation!
Enemy City = 
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = يمكن احتلال المدن عن طريق تقليل صحتها إلى 1، ودخول المدينة بوحدة قتال قريب. \n نظرًا لأن المدن تشفي كل دور، فمن الأفضل الهجوم بوحدات بعيدة المدى واستخدام وحدات القتال القريب الخاصة بك للدفاع عنها حتى يتم هزيمة المدينة!

# Requires translation!
Luxury Resource = 
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = ترتبط الموارد الفاخرة داخل نطاقك ومع تحسيناتها المحددة بشبكة التجارة الخاصة بك. \n كل مورد فاخر فريد لديك يضيف 5 سعادة إلى حضارتك، لكن الموارد الإضافية من نفس النوع لا تضيف أي شيء، لذا استخدمها للتداول مع الحضارات الأخرى!

# Requires translation!
Strategic Resource = 
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = ترتبط الموارد الإستراتيجية داخل نطاقك ومع تحسيناتها المحددة بشبكة التجارة الخاصة بك. \nتسمح لك الموارد الإستراتيجية بتدريب الوحدات وإنشاء المباني التي تتطلب تلك الموارد المحددة، على سبيل المثال يحتاج الفارس إلى الخيول.
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = على عكس الموارد الفاخرة، يوفر كل مورد استراتيجي على الخريطة أكثر من مورد واحد.\nيحتفظ الشريط العلوي بعدد الموارد الإستراتيجية غير المستخدمة التي تمتلكها.\nA يتوفر التنقل الكامل للموارد في علامة تبويب الموارد في شاشة النظرة العامة.

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = لم تعد المدينة قادرة على مقاومة أي مقاومة!\nومع ذلك، للتغلب عليها، يجب عليك دخول المدينة بوحدة قتال قريب

