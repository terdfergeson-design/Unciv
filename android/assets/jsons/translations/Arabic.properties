Elizabeth = إليزابيث
By the grace of God, your days are numbered. = وبإذن الله أيامك معدودة.
We shall never surrender. = لن نستسلم أبدا.
You have triumphed over us. The day is yours. = لقد انتصرت علينا. اليوم هو لك.
Watch yourself, your pride will be your downfall. = انتبه لنفسك، كبريائك سيكون سبب سقوطك.
We are pleased to meet you. = نحن سعداء بلقائك.
Would you be interested in a trade agreement with England? = هل أنت مهتم بإبرام اتفاقية تجارية مع إنجلترا؟
Hello, again. = مرحبا، مرة أخرى.
Oh, it's you! = أوه، هذا أنت!
Sun Never Sets = الشمس لا تغيب أبدا
Long live to Your Highness, Queen Elizabeth Gloriana, leader and protector of the glorious England! Through history, enduring many invasions, England strengthened its will, playing smartly with diplomacy, cunning, and military power, to eventually rose as one of the most dominant Empires the world has ever known. Their matchless navy, brilliant scientists and artists, and powerful merchants, have shaped the known world for centuries. = تحيا لصاحبة السمو الملكة إليزابيث غلوريانا، قائدة وحامية إنجلترا المجيدة! عبر التاريخ، ومع تحملها للعديد من الغزوات، عززت إنجلترا إرادتها، ولعبت بذكاء بالدبلوماسية والماكرة والقوة العسكرية، لترتفع في النهاية كواحدة من أكثر الإمبراطوريات المهيمنة التي عرفها العالم على الإطلاق. لقد ساهمت قواتهم البحرية التي لا مثيل لها، والعلماء والفنانين اللامعين، والتجار الأقوياء، في تشكيل العالم المعروف لعدة قرون.
Queen Elizabeth, will England cast once more its brightness upon all lands and seas of the world? Will your new empire shine through the ages of history? = أيتها الملكة إليزابيث، هل ستلقي إنجلترا بسطوعها مرة أخرى على جميع أراضي وبحار العالم؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
