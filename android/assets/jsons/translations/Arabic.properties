King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = الملك باتشاكوتي سابا إنكا، صانع العالم وحاكم تاوانتينسويو وشعب الإنكا، رعاياك المخلصون يحيونك! في البداية، أظهرت ولاية كوسكو الصغيرة أن الإنكا موعودون بالعظمة. لقد فازوا بالعديد من الحروب ضد أعداء أقوياء، وسحقوا بلا هوادة أي جيش يجرؤ على معارضتهم، وشكلوا إمبراطورية عظيمة تمتد من الإكوادور إلى تشيلي، وهي الأعظم على الإطلاق في أمريكا ما قبل كولومبوس. لم يكن شعب الإنكا مجرد جنود شجعان، بل كان شعب الإنكا بناة وفنانين بارعين، ولا تزال ثقافتهم الرائعة التي لا مثيل لها تبهر العالم اليوم.
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = أيها الإمبراطور باتشاكوتي، احترم اسمك "هزاز الأرض"! هل ستستدعي مرة أخرى قوة الأرض لتوحيد جميع شعب الإنكا تحت حماية سابا إنكا، ابن الشمس؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
