Gandhi = غاندي
I have just received a report that large numbers of my troops have crossed your borders. = لقد تلقيت للتو تقريرًا يفيد بأن أعدادًا كبيرة من قواتي قد عبرت حدودكم.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = محاولاتي لتجنب العنف باءت بالفشل. مبدأ العين بالعين لا يؤدي إلا إلى جعل العالم أعمى.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = يمكنك تقييدي، يمكنك تعذيبي، يمكنك حتى تدمير هذا الجسد، لكنك لن تسجن عقلي أبدًا.
Curious. = فضولي.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = مرحبا، أنا المهندس غاندي. شعبي يدعوني بابو، ولكن من فضلك، اتصل بي صديق.
My friend, are you interested in this arrangement? = صديقي هل أنت مهتم بهذا الترتيب؟
I wish you peace. = أتمنى لك السلام.
Population Growth = النمو السكاني
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = المهاتما غاندي الحكيم، زعيم الهند العظيم، نحن نكرمك! تعد الهند من أقدم دول العالم، حيث يعود تاريخها إلى 10 آلاف عام، وهي مبنية على الروح والدين، حيث ظهرت على هذه الأرض المقدسة ثلاث من الديانات الكبرى في العالم - الهندوسية والبوذية واليانية. كل جانب من جوانب المجتمع الهندي يقدس الفن والموسيقى والألوان، مما يظهر ثراءً كبيرًا ولكن أيضًا فقرًا مدقعًا. لعدة قرون، كانت الهند ممزقة بين ممالك محلية تقاتل بعضها البعض ولكنها أيضًا تصد الغزاة. وفي القرن الثاني عشر الميلادي، حاول الأتراك المسلمون غزو الهند، ثم أخذ المغول مكانهم. في أوائل القرن السابع عشر، كانت الهند لا تزال مجزأة، وقد تم استعمارها من قبل الإنجليز ودبلوماسيتهم وتفوقهم التكنولوجي. وبعد قرنين من الهيمنة البريطانية، استيقظت القومية الهندية، وقد قمت، أيها المهاتما العظيم، بقيادة تمرد سلمي ومنتصر لم يسبق له مثيل في أي مكان في التاريخ!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = غاندي، شعبك يطلب مرة أخرى أن يقوده على طريق الحرية. تحت حماية غانيشا وسوريا، هل تستطيع الهند تحقيق إمكاناتها العظيمة؟ هل ستشرق إمبراطوريتك الجديدة عبر عصور التاريخ؟
