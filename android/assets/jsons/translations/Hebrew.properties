# Capturing a city

What would you like to do with the city of [cityName]? = מה ברצונכם לעשות עם העיר [cityName]?
Annex = סיפוח
Annexed cities become part of your regular empire. = ערים שסופחו הופכות לחלק מהאימפריה הרגילה שלכם.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = אזרחיהן מייצרים פי 2 חוסר שביעות רצון, אלא אם תבנו בית משפט.
Your civilization may not annex this city. = הציוויליזציה שלכם אינה יכולה לספח עיר זו.
Puppet = עיר בובה
Puppeted cities do not increase your tech or policy cost. = ערי בובה אינן מעלות את עלות הטכנולוגיה או המדיניות שלכם.
You have no control over the the production of puppeted cities. = אין לכם שליטה על הייצור בערי בובה.
Puppeted cities also generate 25% less Science and Culture. = ערי בובה מייצרות גם 25% פחות מדע ותרבות.
A puppeted city can be annexed at any time. = ניתן לספח עיר בובה בכל עת.
Liberate (city returns to [originalOwner]) = שחרור (העיר חוזרת ל־[originalOwner])
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = שחרור עיר מחזיר אותה לבעליה המקוריים, ומעניק שיפור יחסים עצום איתם!
Raze = הריסה
Razing the city annexes it, and starts burning the city to the ground. = החרבת העיר מספחת אותה ומתחילה לשרוף את העיר עד היסוד.
Razing the city puppets it, and starts burning the city to the ground. = החרבת העיר הופכת אותה לעיר בובה ומתחילה לשרוף אותה עד היסוד.
The population will gradually dwindle until the city is destroyed. = האוכלוסייה תלך ותדעך עד שהעיר תיהרס כליל.
Original capitals and holy cities cannot be razed. = לא ניתן להחריב ערי בירה מקוריות וערי קודש.
Destroy = השמד
Destroying the city instantly razes the city to the ground. = השמדת העיר מחריבה אותה מיד עד היסוד.
Keep it = השאר אותה
Remove your troops in our border immediately! = הסיגו את כוחותיכם מגבולנו מיד!
Sorry. = סליחה.
Never! = לעולם לא!
Those lands were not yours to take. This has not gone unnoticed. = אדמות אלו לא היו שלכם לקחת. הדבר לא נעלם מעינינו.

